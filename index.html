<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ون بيس - معركة البطاقات</title>
<meta name="theme-color" content="#0a1a2e">
<meta name="description" content="لعبة بطاقات ون بيس ثلاثية الأبعاد بالعربية">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ون بيس TCG">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Bangers&family=Archivo+Black&display=swap" rel="stylesheet">
<style>
:root{
  --gold:#f4c542; --panel:rgba(10,22,40,.85); --line:rgba(244,197,66,.35); --text:#f3ead7;
  --mw:640px; --tilt:38deg; --sy:-.205; --sh:1.255; --hcw:clamp(70px,6.6vw,112px);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:'Cairo',sans-serif;color:var(--text);background:#07111f;
  background-image:radial-gradient(ellipse 120% 60% at 50% -10%,#1f6394 0%,transparent 60%),radial-gradient(ellipse 90% 50% at 50% 110%,#0f5775 0%,transparent 60%),linear-gradient(#0a1a2e,#050d18);
  background-attachment:fixed;overflow-x:hidden}
body.ingame{overflow:hidden;height:100vh;height:100dvh}
html,body{-webkit-tap-highlight-color:transparent;touch-action:manipulation;overscroll-behavior:none}
.card img{-webkit-user-drag:none;-webkit-touch-callout:none}
.page{padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right));padding-top:max(16px,env(safe-area-inset-top))}
.game .hud{padding-top:max(6px,env(safe-area-inset-top))}
.hand{padding-bottom:env(safe-area-inset-bottom)}
@media (max-width:700px){
  .game{padding-bottom:calc(var(--hcw)*1.397*var(--hpk,.6))}
  .game .scene{margin-block:auto}
  .hud{gap:5px;padding-inline:6px}
  .hud .pl{font-size:.7rem;padding-inline-end:6px;max-width:46vw;overflow:hidden}
  .hud .btn.icon{padding:.3em .5em;font-size:.85rem}
  .hud .btn.red{font-size:.8rem;padding:.45em .8em}
  .topbar{gap:6px;padding:8px}
  .topbar .brand{font-size:1.25rem}
  .chip{font-size:.8rem}
  .tile{min-height:120px;padding:16px}
  .logo{font-size:2.6rem}
}
button{font-family:inherit}
input{font-family:inherit}
.btn{background:linear-gradient(#f7d267,#c8912c);color:#2a1a02;border:none;border-radius:999px;padding:.55em 1.3em;font-weight:900;font-size:.95rem;cursor:pointer;box-shadow:0 3px 0 #7a5314,0 6px 16px rgba(0,0,0,.4);transition:transform .15s,filter .15s;white-space:nowrap}
.btn:hover{transform:translateY(-2px);filter:brightness(1.08)}
.btn:active{transform:translateY(1px)}
.btn.sec{background:linear-gradient(#34506e,#1c3149);color:var(--text);box-shadow:0 3px 0 #0c1a29,0 6px 16px rgba(0,0,0,.3)}
.btn.red{background:linear-gradient(#ff6a5e,#c3261c);color:#fff;box-shadow:0 3px 0 #6d120c,0 6px 16px rgba(0,0,0,.4)}
.btn.green{background:linear-gradient(#6af0a0,#1f9d57);color:#032b14;box-shadow:0 3px 0 #0d4f2a,0 6px 16px rgba(0,0,0,.4)}
.btn.purple{background:linear-gradient(#c79bff,#7a3fd0);color:#fff;box-shadow:0 3px 0 #3d1a70,0 6px 16px rgba(0,0,0,.4)}
.btn:disabled{filter:grayscale(1);opacity:.45;cursor:not-allowed;transform:none}
.btn.sm{font-size:.8rem;padding:.4em 1em}
.btn.icon{padding:.4em .7em;font-size:1rem}
.field{display:flex;flex-direction:column;gap:4px;text-align:right}
.field label{font-size:.8rem;color:#9fb3c8;font-weight:700}
.field input{background:#0b1830;border:1px solid var(--line);border-radius:10px;padding:.6em .8em;color:#fff;font-size:1rem;outline:none}
.field input:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(244,197,66,.2)}
.err{color:#ff9a9a;font-weight:700;min-height:1.4em;font-size:.85rem}

/* ---------- Card ---------- */
.card{width:var(--cw,90px);height:calc(var(--cw,90px)*1.397);border-radius:calc(var(--cw,90px)*.055);position:relative;flex:none;cursor:pointer;
  box-shadow:0 3px 8px rgba(0,0,0,.55);transition:box-shadow .25s,translate .25s,scale .25s,rotate .35s,filter .3s;user-select:none;background:#222;font-size:max(8.5px,calc(var(--cw,90px)*.13));color:#fff}
.card img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:inherit;pointer-events:none}
.card .fb{position:absolute;inset:0;border-radius:inherit;background:linear-gradient(155deg,var(--c1),#111);padding:6%;display:flex;flex-direction:column;justify-content:space-between;text-align:center;font-weight:800;line-height:1.15;border:2px solid rgba(255,255,255,.3)}
.card .fb b{font-family:'Bangers';font-size:1.3em}
.card.rested{rotate:90deg;filter:brightness(.72)}
.card .pwr{position:absolute;left:50%;bottom:-.55em;translate:-50% 0;background:#111;border:1px solid #fff8;border-radius:999px;padding:0 .45em;font-family:'Bangers';font-size:1.25em;line-height:1.3;z-index:3;white-space:nowrap;direction:ltr}
.card .pwr.up{background:#0d6b36;border-color:#7dff9b}
.card .pwr.down{background:#8a1616;border-color:#ff9a9a}
.card .donb{position:absolute;top:-.5em;right:-.4em;background:linear-gradient(#ffe38a,#c08a1e);color:#3a2300;font-family:'Bangers';border-radius:999px;padding:0 .4em;font-size:1.1em;z-index:3;box-shadow:0 1px 4px #000;direction:ltr}
.card .st{position:absolute;top:-.5em;left:-.3em;display:flex;gap:1px;z-index:3;font-size:1em}
.card .st i{font-style:normal;background:#000c;border-radius:4px;padding:0 2px}
.card .hc{position:absolute;top:2%;left:3%;width:1.7em;height:1.7em;border-radius:50%;background:#1f9d57;border:2px solid #fff;display:grid;place-items:center;font-family:'Bangers';font-size:1.1em;z-index:3}
.card .xc{position:absolute;left:-.3em;top:40%;background:#fff;color:#000;font-family:'Bangers';border-radius:4px;padding:0 .2em;font-size:.95em;z-index:3}
.card .qty{position:absolute;bottom:4%;left:50%;translate:-50% 0;background:#000d;border:1px solid var(--gold);border-radius:999px;padding:0 .6em;font-weight:900;font-size:1em;white-space:nowrap;z-index:3}
.card .clname{position:absolute;left:0;right:0;bottom:0;padding:.35em .3em .45em;background:linear-gradient(transparent,rgba(0,0,0,.85) 30%);border-radius:0 0 inherit inherit;text-align:center;font-weight:900;font-size:1.05em;line-height:1.15;z-index:2;text-shadow:0 1px 3px #000}
.card .clname small{display:block;font-size:.7em;color:var(--gold);font-weight:800}
.lm-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px;--cw:88px;max-height:55vh;overflow:auto;padding:4px}
.lm-grid .card.on{box-shadow:0 0 0 3px var(--gold),0 0 16px var(--gold)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips button{border:2px solid transparent;border-radius:999px;padding:.35em 1em;font-weight:900;cursor:pointer;color:#fff}
.chips button.on{border-color:#fff;box-shadow:0 0 12px rgba(255,255,255,.4)}
.chips button:disabled{opacity:.35;cursor:not-allowed}
.ablist2{display:flex;flex-direction:column;gap:8px;max-height:42vh;overflow:auto}
.ab2{display:flex;gap:10px;align-items:center;padding:8px;border-radius:12px;background:rgba(255,255,255,.05);cursor:pointer;border:2px solid transparent;--cw:46px;text-align:right}
.ab2.on{border-color:var(--gold);background:rgba(244,197,66,.12)}
.ab2 p{margin:0;font-size:.78rem;line-height:1.55}
.card .newb{position:absolute;top:-.6em;left:50%;translate:-50% 0;background:linear-gradient(#ff6a5e,#c3261c);border-radius:999px;padding:0 .6em;font-weight:900;font-size:1em;z-index:4;white-space:nowrap}
.card.ready{box-shadow:0 0 0 2px #5dffa0,0 0 16px rgba(93,255,160,.8)}
.card.playable{box-shadow:0 0 0 2px #7fd3ff,0 0 14px rgba(127,211,255,.8)}
.card.selected{box-shadow:0 0 0 3px var(--gold),0 0 22px var(--gold)!important}
.card.targetable{animation:pulse .9s infinite;box-shadow:0 0 0 3px #ff4d4d,0 0 20px #ff4d4d;filter:none}
.card.faded{filter:grayscale(1) brightness(.5)}
@keyframes pulse{50%{box-shadow:0 0 0 6px #ff4d4d,0 0 34px #ff4d4d}}
.card.back{background:radial-gradient(circle at 50% 42%,#b3261e 0 18%,transparent 19%),radial-gradient(circle at 50% 50%,#1d3f6e,#07142b 75%);border:2px solid #c9a24a;cursor:default}
.card.back::after{content:'ONE PIECE';position:absolute;left:0;right:0;top:62%;text-align:center;font-family:'Bangers';color:#f4d27a;font-size:1.05em;letter-spacing:1px}
.card.back::before{content:'☠';position:absolute;left:0;right:0;top:27%;text-align:center;font-size:2.2em;color:#fff}
.don{width:var(--cw);height:calc(var(--cw)*1.397);border-radius:calc(var(--cw)*.055);flex:none;position:relative;background:radial-gradient(circle at 50% 45%,#3b2a0c,#0c0904 70%);border:1px solid #d9a93a;box-shadow:0 2px 5px rgba(0,0,0,.6);transition:rotate .35s,filter .3s}
.don::after{content:'DON!!';position:absolute;inset:0;display:grid;place-items:center;font-family:'Bangers';font-size:calc(var(--cw)*.28);color:#ffd35a;text-shadow:0 0 6px #ff9d00,0 2px 0 #000;letter-spacing:1px}
.don.rested{rotate:90deg;filter:brightness(.55) grayscale(.5)}
.lunge{animation:lunge .55s ease}
@keyframes lunge{40%{translate:0 -30px;scale:1.15}}
.mat.op .lunge{animation-name:lungeOp}
@keyframes lungeOp{40%{translate:0 30px;scale:1.15}}
.hit{animation:hit .5s}
@keyframes hit{20%,60%{translate:-7px 0}40%,80%{translate:7px 0}}
.pop{animation:pop .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{0%{scale:.2;opacity:0}100%{scale:1;opacity:1}}
.fx{position:fixed;transform:translate(-50%,0);font-family:'Bangers','Cairo';font-weight:900;font-size:2rem;pointer-events:none;z-index:95;text-shadow:0 2px 0 #000,0 0 12px #000;animation:floatup 1.3s forwards;white-space:nowrap}
@keyframes floatup{to{transform:translate(-50%,-70px);opacity:0}}

/* ---------- Pages ---------- */
.page{max-width:1200px;margin:0 auto;padding:16px 16px 40px}
.topbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 14px;background:var(--panel);border:1px solid var(--line);border-radius:18px;margin-bottom:18px}
.topbar .brand{font-family:'Bangers';font-size:1.8rem;color:#ffd84a;-webkit-text-stroke:1px #3a1e00;letter-spacing:2px;direction:ltr}
.topbar .sp{flex:1}
.chip{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.06);border-radius:999px;padding:4px 12px 4px 4px;font-weight:800;white-space:nowrap}
.chip .av{width:34px;height:34px;border-radius:50%;background-size:cover;background-position:50% 18%;border:2px solid var(--gold)}
.coins{color:#ffd84a}
.pagehead{display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.pagehead h1{margin:0;font-size:1.6rem;color:var(--gold);flex:1}
.logo{font-family:'Bangers',cursive;font-size:clamp(3rem,10vw,6.5rem);letter-spacing:5px;color:#ffd84a;-webkit-text-stroke:3px #3a1e00;text-shadow:0 6px 0 #7a3f00,0 12px 34px rgba(0,0,0,.7);line-height:1;direction:ltr;text-align:center}
.logo small{display:block;font-family:'Cairo';font-weight:900;-webkit-text-stroke:0;font-size:.3em;color:#fff;letter-spacing:0;text-shadow:0 3px 0 #000;margin-top:8px}
.auth{max-width:760px;margin:30px auto;display:flex;flex-direction:column;gap:18px;align-items:stretch}
.authbox{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:22px}
.tabs{display:flex;gap:8px;margin-bottom:16px}
.tabs button{flex:1}
.accs{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 12px}
.accbtn{display:flex;align-items:center;gap:8px;padding:6px 12px 6px 6px;border-radius:999px;border:2px solid transparent;background:rgba(255,255,255,.07);color:#fff;font-weight:800;cursor:pointer}
.accbtn.on{border-color:var(--gold)}
.starters{display:grid;grid-template-columns:repeat(auto-fill,minmax(105px,1fr));gap:10px;margin:8px 0}
.starter{border:2px solid transparent;border-radius:14px;padding:6px;cursor:pointer;background:rgba(255,255,255,.04);text-align:center;font-size:.72rem;font-weight:800;transition:.2s}
.starter .card{--cw:88px;margin:0 auto 4px;pointer-events:none}
.starter.on{border-color:var(--gold);background:rgba(244,197,66,.1);transform:translateY(-4px)}
.hero{display:grid;grid-template-columns:1.2fr 1fr;gap:16px;margin-bottom:18px}
.rankcard{background:linear-gradient(135deg,rgba(244,197,66,.18),rgba(10,22,40,.85));border:1px solid var(--line);border-radius:20px;padding:18px;display:flex;gap:16px;align-items:center}
.rankicon{font-size:3.6rem;filter:drop-shadow(0 4px 10px rgba(0,0,0,.5))}
.rankname{font-size:1.4rem;font-weight:900;color:var(--gold)}
.bar{height:10px;background:rgba(255,255,255,.1);border-radius:999px;overflow:hidden;margin:8px 0 4px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#f7d267,#e08a00);border-radius:inherit}
.stats{display:flex;gap:16px;font-size:.85rem;color:#c3d3e4;flex-wrap:wrap}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.tile{position:relative;border-radius:22px;padding:22px;min-height:150px;cursor:pointer;overflow:hidden;border:1px solid rgba(255,255,255,.12);transition:transform .2s,box-shadow .2s;display:flex;flex-direction:column;justify-content:flex-end;gap:4px;
  background:linear-gradient(160deg,var(--t1),var(--t2));box-shadow:0 10px 30px rgba(0,0,0,.4)}
.tile:hover{transform:translateY(-5px);box-shadow:0 16px 40px rgba(0,0,0,.55),0 0 0 2px var(--gold)}
.tile .ic{font-size:3.2rem;line-height:1;margin-bottom:auto;align-self:flex-start;filter:drop-shadow(0 6px 10px rgba(0,0,0,.4));transition:transform .3s}
.tile:hover .ic{transform:scale(1.15) rotate(-8deg)}
.tile h2{margin:0;font-size:1.35rem;font-weight:900;text-shadow:0 2px 6px rgba(0,0,0,.5)}
.tile p{margin:0;font-size:.82rem;opacity:.9}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px}
.panel h3{margin:0 0 8px;color:var(--gold)}
.deckrow{display:flex;align-items:center;gap:12px;padding:10px;border-radius:14px;background:rgba(255,255,255,.05);margin-bottom:8px;cursor:pointer;border:2px solid transparent}
.deckrow.on{border-color:var(--gold)}
.deckrow .card{--cw:48px}
.deckrow .t{flex:1}
.deckrow .t b{display:block}
.deckrow small{color:#9fb3c8}
.ok{color:#7dff9b}.bad{color:#ff9a9a}
.editor{display:grid;grid-template-columns:1fr 330px;gap:14px;align-items:start}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:12px;--cw:104px}
.gtile{display:flex;flex-direction:column;align-items:center;gap:4px}
.gtile .card{--cw:104px}
.gtile .row{display:flex;gap:4px}
.gtile .row button{width:32px;height:28px;border-radius:8px;border:none;font-weight:900;cursor:pointer;background:#1c3149;color:#fff}
.gtile .row button:hover{background:#34506e}
.dlist{max-height:55vh;overflow:auto}
.dl{display:flex;align-items:center;gap:8px;padding:3px 6px;border-radius:8px;font-size:.84rem}
.dl:nth-child(odd){background:rgba(255,255,255,.04)}
.dl .c{width:22px;height:22px;border-radius:50%;background:#fff;color:#000;display:grid;place-items:center;font-weight:900;font-size:.75rem;flex:none}
.dl .n{flex:1}
.dl button{border:none;background:#1c3149;color:#fff;border-radius:6px;width:24px;cursor:pointer}
.curve{display:flex;align-items:flex-end;gap:4px;height:60px;margin:8px 0}
.curve div{flex:1;background:linear-gradient(#f7d267,#c8912c);border-radius:4px 4px 0 0;position:relative;min-height:2px}
.curve div span{position:absolute;bottom:-16px;left:0;right:0;text-align:center;font-size:.65rem;color:#9fb3c8}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.filters button.on{outline:2px solid var(--gold)}
.leadpick{display:flex;gap:8px;flex-wrap:wrap}
.leadpick .card{--cw:62px}
.leadpick .card.on{box-shadow:0 0 0 3px var(--gold),0 0 16px var(--gold)}
.packs{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px}
.pack{border-radius:20px;padding:14px;background:var(--panel);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.packart{width:150px;height:210px;border-radius:14px;position:relative;overflow:hidden;background:linear-gradient(160deg,var(--p1),#0b0b16);box-shadow:0 10px 24px rgba(0,0,0,.5),inset 0 0 0 3px rgba(255,255,255,.25);transition:transform .3s}
.pack:hover .packart{transform:rotate(-3deg) scale(1.05)}
.packart img{position:absolute;inset:14% 12% 22%;width:76%;height:64%;object-fit:cover;object-position:50% 20%;border-radius:10px;opacity:.9}
.packart .pt{position:absolute;top:4%;left:0;right:0;font-family:'Bangers';font-size:1.4rem;color:#fff;text-shadow:0 2px 0 #000;letter-spacing:2px;direction:ltr}
.packart .pb{position:absolute;bottom:5%;left:0;right:0;font-weight:900;font-size:.8rem;color:#ffd84a;text-shadow:0 2px 0 #000}
.packart::after{content:'';position:absolute;inset:0;background:linear-gradient(115deg,transparent 40%,rgba(255,255,255,.35) 50%,transparent 60%);background-size:250% 100%;animation:shine 3s infinite}
@keyframes shine{from{background-position:120% 0}to{background-position:-120% 0}}
.opening{position:fixed;inset:0;background:rgba(3,8,16,.9);z-index:110;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;padding:16px}
.reveal{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;perspective:1000px}
.flip{width:150px;height:210px;position:relative;transform-style:preserve-3d;transition:transform .7s cubic-bezier(.2,.8,.2,1);cursor:pointer}
.flip.open{transform:rotateY(180deg)}
.flip>div{position:absolute;inset:0;backface-visibility:hidden}
.flip .fr{transform:rotateY(180deg)}
.flip .card{--cw:150px}
.flip .rar{position:absolute;bottom:-26px;left:0;right:0;text-align:center;font-weight:900;font-size:.8rem}
.flip.glow .fr .card{box-shadow:0 0 0 3px #ffd84a,0 0 30px #ffb300}
.ranklist{display:flex;flex-direction:column;gap:8px}
.tier{display:flex;align-items:center;gap:12px;padding:8px 12px;border-radius:12px;background:rgba(255,255,255,.05)}
.tier.cur{background:rgba(244,197,66,.18);outline:2px solid var(--gold)}
.tier .i{font-size:1.8rem}
.lb{width:100%;border-collapse:collapse}
.lb td,.lb th{padding:8px;border-bottom:1px solid rgba(255,255,255,.08);text-align:right}
.lb tr.me td{color:var(--gold);font-weight:900}
.code{font-family:'Archivo Black',monospace;font-size:2.6rem;letter-spacing:8px;color:#ffd84a;background:#0b1830;border:2px dashed var(--gold);border-radius:14px;padding:6px 18px;direction:ltr;display:inline-block}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.diff{display:flex;gap:10px;flex-wrap:wrap}
.diff button.on{outline:3px solid #fff}

/* ---------- Game ---------- */
.game{position:relative;height:100vh;display:flex;flex-direction:column;align-items:center}
.hud{position:relative;z-index:30;display:flex;align-items:center;gap:8px;padding:6px 10px;width:100%;background:linear-gradient(rgba(0,0,0,.55),rgba(0,0,0,.2));border-bottom:1px solid var(--line);height:56px}
.pl{display:flex;align-items:center;gap:6px;font-weight:800;font-size:.85rem;white-space:nowrap;background:rgba(255,255,255,.06);border-radius:999px;padding:3px 10px 3px 3px}
.pl .av{width:30px;height:30px;border-radius:50%;background-size:cover;background-position:50% 18%;border:2px solid #ff7a7a}
.pl.me .av{border-color:#5dffa0}
.turn-info{font-weight:900;white-space:nowrap;display:flex;align-items:center;gap:6px}
.turn-info .dot{width:10px;height:10px;border-radius:50%;background:#5dffa0;box-shadow:0 0 10px #5dffa0}
.turn-info .dot.op{background:#ff6a6a;box-shadow:0 0 10px #ff6a6a}
.hint{font-size:.8rem;color:#c3d3e4;flex:1;text-align:center;line-height:1.3;overflow:hidden;max-height:2.6em}
.scene{perspective:calc(var(--mw)*var(--pm,3.2));perspective-origin:50% 40%;width:100%;display:flex;justify-content:center;align-items:flex-start;height:calc(var(--mw)*var(--sh))}

function basePower(c){
  let b = c.def.power||0;
  for (const m of c.mods) if (m.k==='base') b = m.v;
  if (c.def.t==='C' && c.def.power===4000 && FX_(c).trigger && G && G.turnPlayer===c.owner &&
      P(c.owner).chars.some(x=>x.def.n==='112')) b = 8000;
  return b;
}
function power(c){
  if (!G) return c.def.power;
  let pw = basePower(c) + c.battlePower;
  for (const m of c.mods) if (m.k==='power') pw += m.v;
  const f = FX_(c); if (f.powerS) pw += f.powerS(c);
  if (G.turnPlayer===c.owner) pw += c.don*1000;
  // هالات عامة من القادة والشخصيات
  const own=P(c.owner), mine=G.turnPlayer===c.owner;
  if (c.def.t==='C' && mine && lid(own.leader)==='OP01-001' && own.leader.don>=1) pw+=1000;
  if (mine && c.def.t!=='S' && (T(c,'Supernovas')||T(c,'Navy')) && own.chars.some(x=>x.def.n==='ST02-014'&&x.don>=1&&x.rested)) pw+=1000;
  if (c.def.t==='C' && !mine && lid(ldr(G.turnPlayer))==='OP01-091' && donTotal(G.turnPlayer)>=10) pw-=1000;
  return Math.max(0, pw);
}
function costOf(c){
  let v = c.def.cost; const f = FX_(c);
  if (f.costS && G) v += f.costS(c);
  for (const m of c.mods) if (m.k==='cost') v += m.v;
  return Math.max(0, v);
}
function hasKw(c,k){
  if (c.def.kw.includes(k)) return true;
  if (c.mods.some(m=>m.k==='kw' && m.v===k)) return true;
  const f = FX_(c); if (G && f.kwS && f.kwS(c,k)) return true;
  if (k==='blocker' && c.def.t==='C' && G && lid(ldr(c.owner))==='079' && costOf(c)>=12) return true;
  return false;
}
function handCost(c){
  const f=FX_(c); let red=(f.handRed && G ? f.handRed(c) : 0);
  if (G && G.players && c.owner!=null && c.def.t==='E' && c.def.colors.includes('blue')) red+=P(c.owner).chars.filter(x=>x.def.n==='OP01-067'&&x.don>=1).length;
  return Math.max(0, c.def.cost - red);
}
function counterVal(c){
  if (c.def.t!=='C') return 0;
  if (c.def.counter) return c.def.counter;
  if (!G) return 0;
  const f = FX_(c); if (f.counterS){ const v=f.counterS(c); if (v) return v; }
  if (P(c.owner).chars.some(x=>x.def.n==='063')) return 1000;
  return 0;
}
const any12 = () => G.players.some(pl=>pl.chars.some(c=>costOf(c)>=12));
const oppHas10k = p => P(1-p).chars.some(c=>power(c)>=10000);
const donTotal = p => { const pl=P(p); return pl.donActive+pl.donRested+[pl.leader,...pl.chars].reduce((s,c)=>s+c.don,0); };
const activeCount = p => { const pl=P(p); return pl.donActive + [pl.leader,...pl.chars].filter(c=>!c.rested).length + (pl.stage&&!pl.stage.rested?1:0); };
const oppTurn3k = c => G.turnPlayer!==c.owner ? 3000 : 0;
const elb3k = c => any12() ? 3000 : 0;
const defender = () => G.battle && G.battle.target;
const cardValue = c => (counterVal(c)||(FX_(c).counter?FX_(c).counter.v:0))/1000*1.2 + c.def.cost*.35;

const SETTINGS = (()=>{ try{ return JSON.parse(localStorage.getItem('op17_settings'))||{sfx:true,music:true}; }catch(e){ return {sfx:true,music:true}; } })();

const SFX = {
  ctx:null, master:null, mus:null, timer:null, step:0,
  init(){
    if (!this.ctx){ const AC=window.AudioContext||window.webkitAudioContext; if (!AC) return false;
      this.ctx=new AC(); this.master=this.ctx.createGain(); this.master.gain.value=.55; this.master.connect(this.ctx.destination);
      this.mus=this.ctx.createGain(); this.mus.gain.value=.16; this.mus.connect(this.ctx.destination); }
    if (this.ctx.state==='suspended') this.ctx.resume();
    return true;
  },
  tone(f, d, o={}, out){ const {type='sine', v=.25, t=0, to=null, att=.005}=o; const c=this.ctx, now=c.currentTime+t;
    const osc=c.createOscillator(), g=c.createGain(); osc.type=type; osc.frequency.setValueAtTime(f,now);
    if (to) osc.frequency.exponentialRampToValueAtTime(to, now+d);
    g.gain.setValueAtTime(0,now); g.gain.linearRampToValueAtTime(v, now+att); g.gain.exponentialRampToValueAtTime(.0001, now+d);
    osc.connect(g); g.connect(out||this.master); osc.start(now); osc.stop(now+d+.05); },
  noise(d, o={}){ const {v=.3, t=0, f=1200, q=1, type='bandpass', to=null}=o; const c=this.ctx, now=c.currentTime+t;
    const len=Math.max(1,Math.floor(c.sampleRate*d)); const buf=c.createBuffer(1,len,c.sampleRate); const data=buf.getChannelData(0);
    for (let i=0;i<len;i++) data[i]=Math.random()*2-1;
    const s=c.createBufferSource(); s.buffer=buf; const fl=c.createBiquadFilter(); fl.type=type; fl.frequency.setValueAtTime(f,now);
    if (to) fl.frequency.exponentialRampToValueAtTime(to, now+d); fl.Q.value=q;
    const g=c.createGain(); g.gain.setValueAtTime(v,now); g.gain.exponentialRampToValueAtTime(.0001, now+d);
    s.connect(fl); fl.connect(g); g.connect(this.master); s.start(now); s.stop(now+d); },
  play(n){
    if (!SETTINGS.sfx || !this.init()) return; const T=this;
    switch(n){
      case 'click': T.tone(880,.06,{type:'triangle',v:.1}); break;
      case 'select': T.tone(660,.05,{type:'triangle',v:.09}); T.tone(990,.06,{type:'triangle',v:.07,t:.04}); break;
      case 'draw': T.noise(.12,{v:.18,f:3000,to:6000,type:'highpass'}); break;
      case 'play': T.noise(.25,{v:.25,f:500,to:3000}); T.tone(220,.25,{type:'triangle',v:.2,to:440}); break;
      case 'event': [523,659,784,1046].forEach((f,i)=>T.tone(f,.25,{type:'triangle',v:.14,t:i*.06})); break;
      case 'don': T.tone(1318,.15,{type:'square',v:.06}); T.tone(1760,.25,{type:'square',v:.05,t:.07}); break;
      case 'attack': T.noise(.35,{v:.35,f:400,to:4000}); T.tone(160,.3,{type:'sawtooth',v:.14,to:80}); break;
      case 'damage': T.tone(300,.45,{type:'sawtooth',v:.18,to:80}); T.noise(.3,{v:.4,f:250,type:'lowpass'}); break;
      case 'ko': T.noise(.7,{v:.55,f:900,to:80,type:'lowpass'}); T.tone(120,.6,{type:'square',v:.13,to:30}); break;
      case 'block': T.tone(1200,.3,{type:'square',v:.07,to:900}); T.noise(.15,{v:.3,f:5000,type:'highpass'}); break;
      case 'counter': T.tone(700,.12,{type:'triangle',v:.14}); T.tone(1050,.2,{type:'triangle',v:.14,t:.08}); break;
      case 'buff': T.tone(440,.22,{v:.14,to:880}); break;
      case 'debuff': T.tone(600,.25,{v:.14,to:200}); break;
      case 'trigger': [784,988,1175,1568].forEach((f,i)=>T.tone(f,.4,{v:.12,t:i*.08})); break;
      case 'turn': T.tone(392,.35,{type:'sawtooth',v:.08}); T.tone(523,.55,{type:'sawtooth',v:.08,t:.18}); T.tone(784,.6,{type:'triangle',v:.06,t:.18}); break;
      case 'win': [523,659,784,1046,784,1046,1318].forEach((f,i)=>T.tone(f,.45,{type:'triangle',v:.18,t:i*.13})); break;
      case 'lose': [440,392,349,262].forEach((f,i)=>T.tone(f,.55,{type:'triangle',v:.16,t:i*.26})); break;
      case 'coin': T.tone(988,.08,{type:'square',v:.07}); T.tone(1319,.3,{type:'square',v:.07,t:.08}); break;
      case 'flip': T.noise(.15,{v:.22,f:2000,to:5000}); break;
      case 'rare': [659,831,988,1319,1661,1976].forEach((f,i)=>T.tone(f,.55,{v:.13,t:i*.07})); break;
      case 'error': T.tone(180,.2,{type:'square',v:.08}); break;
      case 'shuffle': for (let i=0;i<6;i++) T.noise(.06,{v:.12,f:3500,type:'highpass',t:i*.05}); break;
    }
  },
  // موسيقى بحرية بسيطة بسلّم صغير
  musicStart(){
    if (this.timer || !SETTINGS.music || !this.init()) return;
    const mel=[57,60,64,65,64,60,62,59, 57,60,64,67,65,64,62,64, 65,64,62,60,59,60,62,64, 57,59,60,62,60,59,57,null];
    const bass=[45,45,41,41,43,43,40,40];
    const hz=m=>440*Math.pow(2,(m-69)/12);
    this.timer=setInterval(()=>{
      if (!this.ctx) return; const s=this.step++ % 32;
      if (mel[s]) this.tone(hz(mel[s]), .32, {type:'triangle', v:.18}, this.mus);
      if (s%4===0) this.tone(hz(bass[(s/4)%8]), .9, {type:'sine', v:.28}, this.mus);
      if (s%8===4) this.tone(hz(mel[s]?mel[s]+12:69), .12, {type:'square', v:.04}, this.mus);
    }, 230);
  },
  musicStop(){ clearInterval(this.timer); this.timer=null; },
};
function sfx(n){ emit('sfx', n); }

/* =========================================================
   المؤثرات البصرية (تُرسل للخصم في اللعب الأونلاين)
   ========================================================= */
function emit(kind, ...args){
  applyEv(kind, args);
  if (NET && NET.role==='host' && NET.open && G && G.mode==='online') NET.send({t:'ev', kind, args});
}
function applyEv(kind, a){
  if (kind==='sfx') SFX.play(a[0]);
  else if (kind==='fx') fxLocal(...a);
  else if (kind==='anim') animLocal(...a);
  else if (kind==='banner') bannerLocal(...a);
  else if (kind==='turn') bannerLocal(a[0]===ME?'⚓ دورك!':`🏴‍☠️ دور ${esc(G.players[a[0]].name)}`, `الدور ${a[1]}`);
}
const fx = (uid, text, color='#fff') => emit('fx', uid, text, color);
const anim = (uid, cls) => emit('anim', uid, cls);
const showBanner = (t, s='') => emit('banner', t, s);
function bannerLocal(t, s=''){ const b=$('#banner'); b.innerHTML=`<div class="t">${t}<span class="s">${s}</span></div>`; b.classList.remove('show'); void b.offsetWidth; b.classList.add('show'); }
function el(uid){ return document.querySelector(`#app .scene [data-uid="${uid}"]`); }
function animLocal(uid, cls){ requestAnimationFrame(()=>{ const e=el(uid); if (e){ e.classList.remove(cls); void e.offsetWidth; e.classList.add(cls); } }); }
function fxLocal(uid, text, color){
  requestAnimationFrame(()=>{ const e=el(uid); if (!e) return; const r=e.getBoundingClientRect();
    const d=document.createElement('div'); d.className='fx'; d.textContent=text; d.style.color=color;
    d.style.left=(r.left+r.width/2)+'px'; d.style.top=(r.top+r.height/3)+'px';
    document.body.appendChild(d); setTimeout(()=>d.remove(),1300); });
}
function confetti(){
  const em=['🎉','⭐','👒','💰','🏴‍☠️','✨'];
  for (let i=0;i<70;i++){ const d=document.createElement('div'); d.className='confetti'; d.textContent=em[i%em.length];
    d.style.left=Math.random()*100+'vw'; d.style.animationDuration=(2.5+Math.random()*2.5)+'s'; d.style.animationDelay=Math.random()*1.5+'s';
    document.body.appendChild(d); setTimeout(()=>d.remove(),7000); }
}

/* =========================================================
   النوافذ والاختيارات (محلياً أو عبر الشبكة)
   ========================================================= */
function openModal(html, handlers={}){
  const m=$('#modal'); m.className='modal-bg'; m.innerHTML=`<div class="modal">${html}</div>`;
  m.onclick=e=>{ const t=e.target.closest('[data-act]'); if (t && handlers[t.dataset.act]) handlers[t.dataset.act](t); };
}
function closeModal(){ const m=$('#modal'); m.className='hidden'; m.innerHTML=''; m.onclick=null; }
// نقطة القرار الموحّدة: اللاعب المحلي يرى نافذة، واللاعب البعيد تُرسل له النافذة
async function choice(p, html, acts){
  if (P(p).ctrl==='remote'){
    G.waiting=true; render();
    const r = await NET.request({t:'modal', html, acts});
    G.waiting=false; return r;
  }
  return new Promise(res=>openModal(html, Object.fromEntries(acts.map(a=>[a, el=>{ closeModal(); res({a, i:el.dataset.i}); }]))));
}
async function ask(p, text, aiVal=true){
  if (P(p).isAI) return aiVal;
  const r=await choice(p, `<h2>❓ قرار</h2><p>${text}</p><div class="modal-btns"><button class="btn" data-act="y">نعم</button><button class="btn sec" data-act="n">لا</button></div>`, ['y','n']);
  return r.a==='y';
}
async function chooseOpt(p, title, labels, aiIdx=0){
  if (P(p).isAI) return aiIdx;
  const r=await choice(p, `<h2>${title}</h2><div class="modal-btns" style="flex-direction:column;align-items:center">${labels.map((l,i)=>`<button class="btn ${i?'sec':''}" data-act="o" data-i="${i}">${l}</button>`).join('')}</div>`, ['o']);
  return +r.i;
}
async function info(p, title, html){
  if (P(p).isAI) return;
  await choice(p, `<h2>${title}</h2>${html}<div class="modal-btns"><button class="btn" data-act="ok">حسناً</button></div>`, ['ok']);
}
async function pickCards(p, cands, o={}){
  const {title='اختر', max=1, min=0, ai=c=>costOf(c)*1000+power(c), note=''} = o;
  if (!cands.length) return [];
  if (P(p).isAI){ const n=Math.min(cands.length, Math.max(min,max)); return [...cands].sort((a,b)=>ai(b)-ai(a)).slice(0,n); }
  const sel=new Set();
  for (;;){
    const html=`<h2>${title}</h2>${note}
      <div class="choices">${cands.map((c,i)=>cardFace(c,{where:isOnField(c)?'field':'modal', cls:sel.has(i)?'on':'', attrs:`data-act="t" data-i="${i}"`})).join('')}</div>
      <div class="modal-btns">${(max>1||min>1)?`<button class="btn" data-act="ok" ${sel.size>=min?'':'disabled'}>تأكيد (${sel.size}/${max})</button>`:''}${min===0?`<button class="btn sec" data-act="skip">تخطي</button>`:''}</div>`;
    const r=await choice(p, html, ['t','ok','skip']);
    if (r.a==='skip') return [];
    if (r.a==='ok'){ if (sel.size>=min) return [...sel].map(i=>cands[i]); continue; }
    const i=+r.i; if (max===1 && min<=1) return [cands[i]];
    if (sel.has(i)) sel.delete(i); else if (sel.size<max) sel.add(i);
  }
}
const pickOpp = (p, filter, n, title) => pickCards(p, P(1-p).chars.filter(filter), {title, max:n});
function isOnField(c){ if (!G || c.owner==null) return false; const pl=P(c.owner); return pl.leader===c || pl.chars.includes(c) || pl.stage===c; }
function pickTarget(prompt, cands, allowCancel=true){
  return new Promise(res=>{ G.targeting={prompt, uids:new Set(cands.map(c=>c.uid)), resolve:res, allowCancel}; render(); });
}
function resolveTarget(uid){ const t=G.targeting; if (!t) return; G.targeting=null; t.resolve(uid==null?null:findCard(uid).c); }

   أفعال اللعبة الأساسية
   ========================================================= */
function draw(p, n){
  const pl=P(p);
  for (let i=0;i<n;i++){
    if (!pl.deck.length){ gameOver(1-p, `نفدت بطاقات مجموعة ${pl.name}!`); return false; }
    pl.hand.push(pl.deck.pop());
  }
  if (n>0) sfx('draw');
  return true;
}
async function payTrash(p, n, filter=()=>true, title){
  const pl=P(p); const cands=pl.hand.filter(filter);
  if (cands.length<n) return false;
  const picked=await pickCards(p, cands, {title:title||`اختر ${n} بطاقة من يدك لرميها`, min:n, max:n, ai:c=>-cardValue(c)});
  if (picked.length<n) return false;
  picked.forEach(c=>{ pl.hand.splice(pl.hand.indexOf(c),1); pl.trash.push(c); });
  return true;
}
async function trashOwn(p, n){ n=Math.min(n,P(p).hand.length); if (n>0) await payTrash(p,n,()=>true,`يجب أن ترمي ${n} بطاقة من يدك`); }
async function oppBottom(p, n){
  const o=1-p, pl=P(o); n=Math.min(n,pl.hand.length); if (!n) return;
  const picked=await pickCards(o, pl.hand, {title:`ضع ${n} بطاقة من يدك أسفل مجموعتك`, min:n, max:n, ai:c=>-cardValue(c)});
  picked.forEach(c=>{ pl.hand.splice(pl.hand.indexOf(c),1); pl.deck.unshift(c); });
}
function payRestDon(p, n){ const pl=P(p); if (pl.donActive<n) return false; pl.donActive-=n; pl.donRested+=n; return true; }
function addDon(p, n, active){ const pl=P(p); n=Math.min(n,pl.donDeck); pl.donDeck-=n; if (active) pl.donActive+=n; else pl.donRested+=n; if (n) sfx('don'); }
function setDonActive(p, n){ const pl=P(p); n=Math.min(n,pl.donRested); pl.donRested-=n; pl.donActive+=n; }
function payDonMinus(p, n){
  const pl=P(p); if (donTotal(p)<n) return false;
  let left=n;
  const a=Math.min(left,pl.donRested); pl.donRested-=a; left-=a;
  const b=Math.min(left,pl.donActive); pl.donActive-=b; left-=b;
  for (const c of [...pl.chars,pl.leader]){ const k=Math.min(left,c.don); c.don-=k; left-=k; }
  pl.donDeck+=n;
  if (G.turnPlayer===p) for (const k of pl.chars) if (k.def.n==='062' && onceOk(p,k,'dr')){ markOnce(p,k,'dr'); addDon(p,1,true); setDonActive(p,1); }
  return true;
}
async function useCost(p, text, can, pay, aiWant=true){
  if (!can) return false;
  if (P(p).isAI){ if (!aiWant) return false; }
  else if (!await ask(p, text)) return false;
  const r=await pay(); return r!==false;
}
function restAnyMine(p, n){
  const pl=P(p); let left=n;
  const d=Math.min(left,pl.donActive); pl.donActive-=d; pl.donRested+=d; left-=d;
  for (const c of [...pl.chars, pl.stage, pl.leader]){ if (left<=0) break; if (c && !c.rested && c!==defender()){ c.rested=true; left--; } }
  return left<=0;
}
function addLife(p){ const pl=P(p); if (pl.deck.length){ pl.life.push(pl.deck.pop()); fx(ldr(p).uid,'+1 ❤','#ff8aa0'); } }
async function lookTop(p, n, filter, restTo='bottom', label='بطاقة'){
  const pl=P(p); const cards=[];
  for (let i=0;i<n && pl.deck.length;i++) cards.push(pl.deck.pop());
  if (!cards.length) return;
  const elig=cards.filter(filter);
  const note=`<p style="font-size:.8rem;opacity:.8">البطاقات المكشوفة: ${cards.map(nm).join('، ')}</p>`;
  let chosen=[];
  if (elig.length) chosen=await pickCards(p, elig, {title:`اختر ${label} لإضافتها إلى يدك`, max:1, ai:c=>c.def.cost, note});
  else await info(p, 'لا توجد بطاقة مناسبة', note);
  chosen.forEach(c=>pl.hand.push(c));
  cards.filter(c=>!chosen.includes(c)).forEach(c=> restTo==='trash' ? pl.trash.push(c) : pl.deck.unshift(c));
}
function removeFromField(c){ const pl=P(c.owner); if (pl.stage===c) pl.stage=null; else pl.chars=pl.chars.filter(x=>x!==c); pl.donRested+=c.don; resetInst(c); }
function trashFromField(c){ removeFromField(c); P(c.owner).trash.push(c); }
async function koRaw(c){
  sfx('ko'); removeFromField(c); P(c.owner).trash.push(c);
  // قائد كايدو (OP01-061): عند إقصاء شخصية للخصم خلال دورك
  const tp=G.turnPlayer, tl=ldr(tp);
  if (c.def.t==='C' && c.owner!==tp && lid(tl)==='OP01-061' && tl.don>=1 && onceOk(tp,tl,'k61')){ markOnce(tp,tl,'k61'); addDon(tp,1,true); fx(tl.uid,'+DON!!','#ffd84a'); }
  const f=FX_(c); if (f.onKO && !G.over){ render(); await sleep(300); await f.onKO(c.owner, c); }
}
async function tryReplace(c, isKO, byOpp){
  const p=c.owner, pl=P(p); const opts=[];
  if (byOpp){
    const marco=pl.chars.find(m=>m.def.n==='015' && m!==c);
    if (marco) opts.push({label:'أقصِ ماركو بدلاً منها', run:async()=>{ await koRaw(marco); }});
    if (T(c,RH) && pl.chars.some(m=>m.def.n==='021') && activeCount(p)>0) opts.push({label:'أرح إحدى بطاقاتك بدلاً من ذلك (كرون أولي)', run:async()=>{ restAnyMine(p,1); }});
    if (c.def.n==='043' && pl.hand.length>=2) opts.push({label:'ارمِ بطاقتين من يدك بدلاً من ذلك (غانزوي)', run:async()=>{ await payTrash(p,2); }});
    if (pl.chars.some(m=>m.def.n==='045') && pl.hand.length>=2) opts.push({label:'ارمِ بطاقتين من يدك بدلاً من ذلك (كيو)', run:async()=>{ await payTrash(p,2); }});
    if (pl.chars.some(m=>m.def.n==='095') && pl.trash.length>=3) opts.push({label:'ضع 3 بطاقات من مقبرتك أسفل مجموعتك (زورو)', run:async()=>{ pl.deck.unshift(...pl.trash.splice(0,3)); }});
  }
  if (isKO && (T(c,'East Blue')||T(c,'Straw Hat Crew'))){
    const nami=pl.chars.find(m=>m.def.n==='023' && !m.rested);
    if (nami) opts.push({label:'أرح نامي بدلاً من ذلك', run:async()=>{ nami.rested=true; }});
  }
  if (!opts.length) return false;
  const i=await chooseOpt(p, `🛡 ${nm(c)} على وشك المغادرة! استخدم تأثيراً بديلاً؟`, [...opts.map(o=>o.label), 'لا، دعها تغادر'], 0);
  if (i>=opts.length) return false;
  await opts[i].run(); fx(c.uid,'محمية!','#7dd3ff'); sfx('block');
  return true;
}
async function koEffect(c, byP){ if (!isOnField(c)) return; if (await tryReplace(c, true, c.owner!==byP)) return; anim(c.uid,'hit'); fx(c.uid,'KO!','#ff5b5b'); await sleep(250); await koRaw(c); }
async function bounce(c, byP){ if (!isOnField(c)) return; if (await tryReplace(c, false, c.owner!==byP)) return; removeFromField(c); P(c.owner).hand.push(c); sfx('flip'); }
async function bottomDeck(c, byP){ if (!isOnField(c)) return; if (await tryReplace(c, false, c.owner!==byP)) return; removeFromField(c); P(c.owner).deck.unshift(c); sfx('flip'); }
async function buffBattle(p, v, filter=()=>true){
  const pl=P(p); const cands=[pl.leader,...pl.chars].filter(filter);
  if (!cands.length) return;
  const d=defender();
  const [t]=await pickCards(p, cands, {title:`اختر من يحصل على +${v} قوة في هذه المعركة`, max:1, min:1, ai:c=>c===d?1:0});
  if (t) battleBuff(t, v);
}
async function enterField(p, c, from='hand'){
  const pl=P(p);
  if (c.def.t==='C' && pl.chars.length>=5){ pl.trash.push(c); return; }
  resetInst(c); c.sick=true; c.playedTurn=G.turnCount;
  if (c.def.t==='S'){ if (pl.stage) pl.trash.push(pl.stage); pl.stage=c; } else pl.chars.push(c);
  sfx('play'); render(); anim(c.uid,'pop'); await sleep(420);
  const op=FX_(c).onPlay;
  if (op && !(op.yourTurn && G.turnPlayer!==p) && !G.over){ await op.run(p,c); render(); }
}
async function playFrom(p, c, zone){ const pl=P(p); const arr=zone==='trash'?pl.trash:pl.hand; const i=arr.indexOf(c); if (i<0) return; arr.splice(i,1); await enterField(p,c,zone); }

'030':{d:'عند اللعب: يمكنك إراحة DON!! لتحصل على الاندفاع هذا الدور. تفعيل رئيسي (مرة كل دور): إذا كانت يدك 5 بطاقات أو أقل، اجعل DON!! واحدة نشطة.',

/* ---------- أدوات إضافية لمجموعة OP-01 ومجموعات البداية ---------- */
function giveRested(p, c, n){ const pl=P(p); n=Math.min(n,pl.donRested); if (n<=0) return; pl.donRested-=n; c.don+=n; fx(c.uid,`+${n} DON`,'#ffd84a'); sfx('don'); }
async function scry(p, n){
  const pl=P(p); const top=pl.deck.slice(-n); if (!top.length) return;
  let bot=await pickCards(p, top, {title:`أعلى ${top.length} بطاقات في مجموعتك: اختر ما تضعه في الأسفل (والباقي يبقى في الأعلى)`, max:top.length, ai:x=>x.def.cost>donTotal(p)+2?1:-1});
  if (P(p).isAI) bot=bot.filter(x=>x.def.cost>donTotal(p)+2);
  bot.forEach(c=>{ pl.deck.splice(pl.deck.indexOf(c),1); pl.deck.unshift(c); });
}
async function playFromDeck(p, filter){ const pl=P(p); const c=[...pl.deck].reverse().find(filter); if (c && pl.chars.length<5){ pl.deck.splice(pl.deck.indexOf(c),1); shuffle(pl.deck); await enterField(p,c,'deck'); } else shuffle(pl.deck); }
function lifeToHand(p){ const pl=P(p); if (!pl.life.length) return false; pl.hand.push(pl.life.pop()); fx(ldr(p).uid,'❤ → ✋','#ff8aa0'); return true; }
async function fromTrash(p, filter, title){ const [t]=await pickCards(p, P(p).trash.filter(filter), {title, ai:x=>x.def.cost}); if (t){ P(p).trash.splice(P(p).trash.indexOf(t),1); P(p).hand.push(t); sfx('draw'); } return t; }
async function playHand(p, filter, title){ const [t]=await pickCards(p, P(p).hand.filter(x=>x.def.t==='C'&&filter(x)), {title, ai:x=>x.def.cost}); if (t) await playFrom(p,t,'hand'); return t; }
async function pickOwn(p, filter, title, ai){ const [t]=await pickCards(p,[ldr(p),...P(p).chars].filter(filter),{title, ai:ai||(x=>atkMode(x)?power(x)+50000:power(x))}); return t; }
async function pickOppAny(p, title){ const b=G.battle; const [t]=await pickCards(p,[ldr(1-p),...P(1-p).chars],{title, ai:x=>b&&x===b.attacker?2:x.def.t==='L'?1:0}); return t; }
async function setActive(p, filter, title){ const [t]=await pickCards(p, P(p).chars.filter(x=>x.rested&&filter(x)), {title, ai:x=>power(x)}); if (t){ t.rested=false; fx(t.uid,'🔄','#7dff9b'); } return t; }
const leaderIs = (p,n) => nameIs(ldr(p),n);
const dn = (c,n) => c.don>=n;
const myTurn = c => G.turnPlayer===c.owner;
// بطاقة مضاد تعيد شخصية إلى اليد: قيمتها للذكاء الاصطناعي عالية إذا أمكنها إبعاد المهاجم
const bounceAttackerV = max => d => { const a=G.battle&&G.battle.attacker; return a&&a.def.t==='C'&&costOf(a)<=max ? 99000 : 0; };
async function bounceAny(p, max, title, filter=()=>true){ const b=G.battle; const [t]=await pickCards(p,[...P(1-p).chars,...P(p).chars].filter(x=>costOf(x)<=max&&filter(x)),{title, ai:x=>x.owner===p?-9:(b&&x===b.attacker?99:costOf(x))}); if (t) await bounce(t,p); }
async function bottomAny(p, max, title){ const [t]=await pickCards(p,[...P(1-p).chars,...P(p).chars].filter(x=>costOf(x)<=max),{title, ai:x=>x.owner===p?-9:costOf(x)}); if (t) await bottomDeck(t,p); }

'OP01-093':{d:'عند اللعب ①: أضف DON!! مستريحة من كومة DON!!.', onPlay:{run:async p=>{ if (await useCost(p,'أرح DON!! واحدة لإضافة DON!!؟',P(p).donActive>=1&&P(p).donDeck>0,()=>payRestDon(p,1))) addDon(p,1,false); }}},
'OP01-094':{d:'عند اللعب DON!! −6: إذا كان قائدك من قراصنة الوحوش، أقصِ كل الشخصيات الأخرى في الملعب (للطرفين).',
  onPlay:{run:async(p,c)=>{ const others=()=>[...P(1-p).chars,...P(p).chars.filter(x=>x!==c)];
    if (!T(ldr(p),AKP)) return;
    if (await useCost(p,'أعد 6 DON!! لإقصاء كل الشخصيات الأخرى؟',donTotal(p)>=6&&others().length>0,()=>payDonMinus(p,6),P(1-p).chars.reduce((s,x)=>s+costOf(x),0)>P(p).chars.filter(x=>x!==c).reduce((s,x)=>s+costOf(x),0)+3)){
      showBanner('🐉 كايدو','دمار شامل!'); for (const t of others()) await koEffect(t,p); } }}},
'OP01-095':{d:'عند اللعب: اسحب بطاقة إذا كانت لديك 8 DON!! أو أكثر في ملعبك.', onPlay:{run:async p=>{ if (donTotal(p)>=8) draw(p,1); }}},
'OP01-096':{d:'عند اللعب DON!! −2: أقصِ شخصية للخصم تكلفتها 3 أو أقل وأخرى تكلفتها 2 أو أقل.',
  onPlay:{run:async p=>{ if (await useCost(p,'أعد 2 DON!! لإقصاء شخصيتين للخصم؟',donTotal(p)>=2&&P(1-p).chars.some(x=>costOf(x)<=3),()=>payDonMinus(p,2))){
    const [a]=await pickOpp(p,x=>costOf(x)<=3,1,'أقصِ شخصية (تكلفة ≤ 3)'); if (a) await koEffect(a,p);
    const [b]=await pickOpp(p,x=>costOf(x)<=2,1,'أقصِ شخصية (تكلفة ≤ 2)'); if (b) await koEffect(b,p); } }}},
'OP01-097':{d:'عند اللعب DON!! −1: يحصل على الاندفاع هذا الدور، ثم أعطِ شخصية للخصم −2000 قوة.',
  onPlay:{run:async(p,c)=>{ if (await useCost(p,'أعد DON!! واحدة: اندفاع و−2000 لشخصية للخصم؟',donTotal(p)>=1,()=>payDonMinus(p,1),donTotal(p)>=4)){ giveKw(c,'rush'); const [t]=await pickOpp(p,()=>true,1,'شخصية للخصم: −2000'); if (t) debuff(t,2000); } }}},
'OP01-098':{d:'عند اللعب: أضف إلى يدك "فاكهة الشيطان الاصطناعية SMILE" من مجموعتك، ثم اخلط المجموعة.',
  onPlay:{run:async p=>{ const pl=P(p); const c=pl.deck.find(x=>x.def.n==='OP01-116'); if (c){ pl.deck.splice(pl.deck.indexOf(c),1); pl.hand.push(c); sfx('draw'); } shuffle(pl.deck); }}},
'OP01-099':{d:'شخصياتك من عشيرة كوروزومي (غير سيميمارو) لا يمكن إقصاؤها في المعركة.'},
'OP01-100':{d:'حارس.'},
'OP01-101':{d:'[DON!! ×1] عند الهجوم: يمكنك رمي بطاقة لإضافة DON!! مستريحة.', whenAtk:{don:1, run:async p=>{ if (await useCost(p,'ارمِ بطاقة لإضافة DON!!؟',P(p).hand.length>0&&P(p).donDeck>0,()=>payTrash(p,1),P(p).hand.length>=5)) addDon(p,1,false); }}},
'OP01-102':{d:'عند الهجوم DON!! −1: يرمي الخصم بطاقة من يده.', whenAtk:{run:async p=>{ if (await useCost(p,'أعد DON!! واحدة ليرمي الخصم بطاقة؟',donTotal(p)>=1&&P(1-p).hand.length>0,()=>payDonMinus(p,1),donTotal(p)>=5)) await trashOwn(1-p,1); }}},
'OP01-103':{d:'بطاقة بلا تأثير — قوة 6000.'},
'OP01-104':{d:'بلا تأثير. تريغر: العب هذه البطاقة.', trigger:{play:true}},
'OP01-105':{d:'عند اللعب: اكشف بطاقتين عشوائيتين من يد الخصم.',
  onPlay:{run:async p=>{ const h=shuffle([...P(1-p).hand]).slice(0,2); if (h.length) await info(p,'بطاقات من يد الخصم',`<div class="choices">${h.map(c=>cardFace(c,{where:'modal'})).join('')}</div>`); }}},
'OP01-106':{d:'عند اللعب: أضف DON!! مستريحة. تريغر: العب هذه البطاقة.', onPlay:{run:async p=>addDon(p,1,false)}, trigger:{play:true}},
'OP01-107':{d:'بطاقة بلا تأثير — قوة 7000.'},
'OP01-108':{d:'عند الإقصاء DON!! −1: أقصِ شخصية للخصم تكلفتها 5 أو أقل.', onKO:async p=>{ if (await useCost(p,'أعد DON!! واحدة لإقصاء شخصية (تكلفة ≤ 5)؟',donTotal(p)>=1&&P(1-p).chars.some(x=>costOf(x)<=5),()=>payDonMinus(p,1))){ const [t]=await pickOpp(p,x=>costOf(x)<=5,1,'أقصِ شخصية (تكلفة ≤ 5)'); if (t) await koEffect(t,p); } }},
'OP01-109':{d:'[DON!! ×1] خلال دورك: إذا كانت لديك 8 DON!! أو أكثر في ملعبك، +1000 قوة.', powerS:c=>dn(c,1)&&myTurn(c)&&donTotal(c.owner)>=8?1000:0},
'OP01-110':{d:'بطاقة بلا تأثير — قوة 8000.'},
'OP01-111':{d:'حارس. عند الصد DON!! −1: +1000 قوة هذا الدور.', onBlock:{run:async(p,c)=>{ if (await useCost(p,'أعد DON!! واحدة لتحصل بلاك ماريا على +1000؟',donTotal(p)>=1,()=>payDonMinus(p,1),aiNeed(p,1000))) buffTurn(c,1000); }}},
'OP01-112':{d:'تفعيل رئيسي (مرة كل دور) DON!! −1: يمكنه مهاجمة شخصيات الخصم النشطة هذا الدور.',
  act:{can:(p,c)=>donTotal(p)>=1&&P(1-p).chars.some(x=>!x.rested), ai:(p,c)=>!!atkMode(c)&&P(1-p).chars.some(x=>!x.rested&&power(x)<=power(c)&&costOf(x)>=3), run:async(p,c)=>{ if (payDonMinus(p,1)) addMod(c,{k:'atkActive',until:thisTurn()}); }}},
'OP01-113':{d:'عند الإقصاء: أضف DON!! مستريحة.', onKO:async p=>addDon(p,1,false)},
'OP01-114':{d:'عند اللعب DON!! −1: يرمي الخصم بطاقة من يده.', onPlay:{run:async p=>{ if (await useCost(p,'أعد DON!! واحدة ليرمي الخصم بطاقة؟',donTotal(p)>=1&&P(1-p).hand.length>0,()=>payDonMinus(p,1),donTotal(p)>=5)) await trashOwn(1-p,1); }}},
'OP01-115':{d:'رئيسي: أقصِ شخصية للخصم تكلفتها 2 أو أقل، ثم أضف DON!! نشطة. تريغر: نفس التأثير.',
  main:{run:async p=>{ const [t]=await pickOpp(p,x=>costOf(x)<=2,1,'أقصِ شخصية (تكلفة ≤ 2)'); if (t) await koEffect(t,p); addDon(p,1,true); }},
  trigger:{run:async p=>{ const [t]=await pickOpp(p,x=>costOf(x)<=2,1,'أقصِ شخصية (تكلفة ≤ 2)'); if (t) await koEffect(t,p); addDon(p,1,true); }}},
'OP01-116':{d:'رئيسي: انظر إلى أعلى 5 بطاقات والعب شخصية SMILE تكلفتها 3 أو أقل. تريغر: نفس التأثير.',
  main:{run:async p=>smileLook(p)}, trigger:{run:async p=>smileLook(p)}},
'OP01-117':{d:'رئيسي DON!! −1: أرح شخصية للخصم تكلفتها 6 أو أقل.',
  main:{can:p=>donTotal(p)>=1&&P(1-p).chars.some(x=>!x.rested&&costOf(x)<=6), run:async p=>{ if (payDonMinus(p,1)){ const [t]=await pickOpp(p,x=>!x.rested&&costOf(x)<=6,1,'أرح شخصية (تكلفة ≤ 6)'); if (t) restCard(t); } }}},
'OP01-118':{d:'مضاد DON!! −2: +2000 للمدافع، ثم اسحب بطاقة. تريغر: أضف DON!! نشطة.',
  counter:{v:2000, can:p=>donTotal(p)>=3, run:async p=>{ payDonMinus(p,2); battleBuff(defender(),2000); draw(p,1); }},
  trigger:{run:async p=>addDon(p,1,true)}},
'OP01-119':{d:'مضاد: +4000 للمدافع، ثم إذا كانت حياتك 2 أو أقل أضف DON!! مستريحة. تريغر: أضف DON!! نشطة.',
  counter:{v:4000, run:async p=>{ battleBuff(defender(),4000); if (P(p).life.length<=2) addDon(p,1,false); }},
  trigger:{run:async p=>addDon(p,1,true)}},

'ST01-008':{d:'بطاقة بلا تأثير — قوة 5000 بتكلفة 3.'},

'ST01-012':{d:'اندفاع. [DON!! ×2] عند الهجوم: لا يستطيع الخصم استخدام أي حارس في هذه المعركة.', whenAtk:{don:2, run:async p=>{ G.battle.noBlock=()=>true; }}},

'ST01-016':{d:'رئيسي: قائدك أو شخصيتك من قبعة القش لا يمكن صدّها هذا الدور. تريغر: أقصِ شخصية حارسة للخصم تكلفتها 3 أو أقل.',

function aiNeed(p, v){

  const kw={blocker:'🛡 حارس',rush:'⚡ اندفاع',rc:'⚡ اندفاع (ضد الشخصيات)',ban:'☄ نفي',double:'⚔⚔ هجوم مزدوج',unblockable:'🚫 لا يمكن صدّه'};

async function hashPw(salt, pw){
  const s=salt+'|'+pw;
  if (window.crypto && crypto.subtle){ try{ const b=await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s)); return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join(''); }catch(e){} }
  let h=5381; for (const ch of s) h=((h<<5)+h+ch.charCodeAt(0))|0; return 'x'+(h>>>0).toString(16);
}
// مجموعة جاهزة لقائد: أفضل 16 بطاقة متوافقة (نفس المجموعة والأنواع المشتركة أولاً)
function deckCounts(leaderN){
  const L=DB[leaderN], lt=L.types.filter(t=>t!=='The Four Emperors');
  const score=d=>(d.set===L.set?4:0)+d.types.filter(t=>lt.includes(t)).length*3+(d.t==='C'?1:0)+Math.random();
  const pool=Object.values(DB).filter(d=>d.t!=='L' && fits(d,leaderN)).sort((a,b)=>score(b)-score(a)).slice(0,16);
  const cnt=new Map(pool.map(d=>[d.n,3])); let sum=pool.length*3;
  const desc=[...pool].sort((a,b)=>b.cost-a.cost), asc=[...pool].sort((a,b)=>a.cost-b.cost);
  for (let i=0; sum>50; i=(i+1)%desc.length){ const n=desc[i].n; if (cnt.get(n)>1){ cnt.set(n,cnt.get(n)-1); sum--; } }
  for (let i=0; sum<50; i=(i+1)%asc.length){ const n=asc[i].n; if (cnt.get(n)<4){ cnt.set(n,cnt.get(n)+1); sum++; } }
  return Object.fromEntries(cnt);
}
const deckSize = d => Object.values(d.cards).reduce((s,v)=>s+v,0);
function deckIssues(d){
  const out=[]; if (!d.leader) return ['اختر قائداً'];
  const n=deckSize(d);
  if (n!==50) out.push(`المجموعة ${n}/50 بطاقة`);
  for (const [k,v] of Object.entries(d.cards)){
    if (!DB[k]){ out.push('بطاقة غير معروفة'); continue; }
    if (!fits(DB[k],d.leader)) out.push(`${DB[k].ar} ليست بلون القائد`);
    if (v>4 && !unlimited(DB[k])) out.push(`${DB[k].ar}: أكثر من 4 نسخ`);
    if (ACC && v>(ACC.col[k]||0)) out.push(`${DB[k].ar}: لا تملك نسخاً كافية`);
  }
  if (ACC && !ownsLeader(d.leader)) out.push('لا تملك هذا القائد');
  return out;
}

function atkMode(c){
  const p=c.owner;
  if (!G || G.over || G.turnPlayer!==p || G.phase!=='main' || G.turnCount===1) return null;
  if (c.rested || c.mods.some(m=>m.k==='cantAttack') || c.def.t==='S') return null;
  if (c.def.t==='C' && c.sick){ if (hasKw(c,'rush')) return 'all'; if (hasKw(c,'rc')) return 'chars'; return null; }
  return 'all';
}
function attackWhy(c){
  if (G.turnCount===1) return 'اللاعب الأول لا يهاجم في دوره الأول';
  if (c.rested) return 'البطاقة في وضع الراحة';
  if (c.mods.some(m=>m.k==='cantAttack')) return 'ممنوعة من الهجوم بتأثير';
  if (c.def.t==='C' && c.sick) return 'لُعبت هذا الدور (بلا اندفاع)';
  return '';
}
function attackTargets(c){
  const mode=atkMode(c); if (!mode) return [];
  const o=P(1-c.owner);
  const f=FX_(c), vsActive=(f.atkActive&&f.atkActive(c)) || c.mods.some(m=>m.k==='atkActive');
  let t=[...(mode==='all'?[o.leader]:[]), ...o.chars.filter(x=>x.rested||vsActive)];
  const johns=o.chars.filter(x=>x.def.n==='044'&&x.rested);
  if (T(o.leader,ROCKS) && johns.length) t=t.filter(x=>johns.includes(x));
  const kids=o.chars.filter(x=>x.def.n==='OP01-051'&&x.rested&&x.don>=1);
  if (kids.length) t=t.filter(x=>kids.includes(x));
  return t;
}
function canPlay(p, c){
  const pl=P(p), d=c.def, f=FX_(c), cost=handCost(c);
  if (d.t==='E' && !f.main) return {ok:false, why:'بطاقة مضاد فقط — تُستخدم عند تعرضك للهجوم'};
  if (cost>pl.donActive) return {ok:false, why:`تحتاج ${cost} DON!! نشطة (لديك ${pl.donActive})`};
  if (d.t==='C' && pl.chars.length>=5) return {ok:false, why:'الملعب ممتلئ (5 شخصيات)'};
  if (d.t==='C' && pl.noCharPlay===G.turnCount) return {ok:false, why:'لا يمكنك لعب شخصيات هذا الدور'};
  if (d.t==='E' && f.main.can && !f.main.can(p,c)) return {ok:false, why:'شروط التأثير غير متوفرة'};
  return {ok:true};
}
function actAvail(p, c){
  const a=FX_(c).act; if (!a || G.turnPlayer!==p || G.phase!=='main' || G.over) return false;
  if (!a.multi && !onceOk(p,c,'act')) return false;
  return a.can ? a.can(p,c) : true;
}

async function playFromHand(p, c){
  const pl=P(p); if (!canPlay(p,c).ok) return;
  const cost=handCost(c);
  pl.donActive-=cost; pl.donRested+=cost;
  pl.hand.splice(pl.hand.indexOf(c),1);
  if (c.def.t==='E'){
    pl.trash.push(c); sfx('event');
    showBanner(`📜 ${nm(c)}`, pl.name);
    render(); await sleep(700);

}

// إجراء اللاعب في المرحلة الرئيسية (محلياً أو قادماً من الشبكة)
async function performAction(p, act, uid, tgtUid){
  if (!G || G.over) return;
  if (act==='surrender'){ gameOver(1-p, `${P(p).name} استسلم`); return; }
  if (G.turnPlayer!==p || G.phase!=='main' || G.busy) return;
  if (act==='end'){ endTurn(p); return; }
  const s=uid!=null && findCard(uid); if (!s || s.p!==p) return;
  G.busy=true; G.selected=null;
  try{
    if (act==='play' && s.zone==='hand') await playFromHand(p,s.c);
    else if (act==='don' && s.zone==='field') attachDon(p,s.c,1);
    else if (act==='donall' && s.zone==='field') attachDon(p,s.c,P(p).donActive);
    else if (act==='activate' && actAvail(p,s.c)) await runAct(p,s.c);
    else if (act==='attack'){ const t=findCard(tgtUid); if (t && attackTargets(s.c).includes(t.c)) await declareAttack(s.c,t.c); }
  } finally { if (!G.over){ G.busy=false; render(); } }
}

function oppAtkAbilities(d){
  const D=P(d), list=[];
  for (const c of [D.leader, ...D.chars, ...(D.stage?[D.stage]:[])]){
    const f=FX_(c).oppAtk; if (!f) continue;
    const key=f.key||'oa';
    if (!onceOk(d,c,key)) continue;
    if (f.can && !f.can(d,c)) continue;
    list.push({c, f, key});
  }
  return list;
}
function counterOptions(d){

    if (D.donActive<handCost(c)) return false;

  });
}
async function useCounter(d, c){

async function aiDefend(d){
  const D=P(d), b=G.battle; if (!b) return;
  const need=()=>power(b.attacker)-power(b.target)+1000;
  const lethal=()=>b.target.def.t==='L'&&D.life.length===0;
  const easy=G.diff==='easy';
  for (const x of oppAtkAbilities(d)){
    if (!easy && x.f.ai && x.f.ai(d,x.c)){ markOnce(d,x.c,x.key); sfx('trigger'); await x.f.run(d,x.c); render(); await sleep(400); }
  }
  let blocked=false;
  if (!hasKw(b.attacker,'unblockable') && need()>0 && !(easy && !lethal())){
    const bl=D.chars.filter(c=>hasKw(c,'blocker')&&!c.rested&&c!==b.target&&canBlockWith(c));
    const worth = b.target.def.t==='L' ? (D.life.length<=2) : costOf(b.target)>=4;
    if (bl.length && worth){
      bl.sort((x,y)=>costOf(x)-costOf(y));
      const x=bl.find(c=>power(c)>power(b.attacker)) || bl[0];
      x.rested=true; b.target=x; blocked=true; sfx('block'); fx(x.uid,'🛡 صد!','#7dd3ff'); render(); await sleep(500); await runOnBlock(x);
    }
  }
  if (need()>0 && !(easy && !lethal())){
    const want = b.target.def.t==='L' ? (lethal() || D.life.length<=2 || (D.life.length<=3 && need()<=2000)) : (!blocked && costOf(b.target)>=4);
    if (want){
      const cv=c=>{ const v=FX_(c).counter.v; return typeof v==='function'?v(d):v; };
      const opts=counterOptions(d).map(c=>({c, v:c.def.t==='C'?counterVal(c):cv(c), cost:c.def.t==='E'?handCost(c):0})).filter(o=>o.v>0).sort((x,y)=>y.v-x.v);
      const pick=[]; let sum=0, don=D.donActive;
      for (const o of opts){ if (sum>=need()) break; if (o.cost>don) continue; don-=o.cost; pick.push(o); sum+=o.v; }
      if (sum>=need()) for (const o of pick){ if (D.hand.includes(o.c) && need()>0 && isOnField(b.attacker)){ await useCounter(d,o.c); await sleep(350); } }
    }
  }
}
async function takeLife(d, banish){

  if (banish){ D.trash.push(card); fx(D.leader.uid,'☄ نفي','#ffb36b'); return; }

      <div class="modal-btns"><button class="btn" data-act="y">✨ فعّل التريغر</button><button class="btn sec" data-act="n">أضفها إلى يدي</button></div>`, ['y','n']); use=r.a==='y'; }

async function declareAttack(att, tgt){
  const p=att.owner, d=1-p, A=P(p), D=P(d);
  att.rested=true; G.battle={attacker:att, target:tgt};
  sfx('attack'); render(); anim(att.uid,'lunge'); anim(tgt.uid,'hit'); await sleep(650);
  const wa=FX_(att).whenAtk;
  if (wa && (!wa.don || att.don>=wa.don) && (!wa.key || onceOk(p,att,wa.key))){
    if (wa.key) markOnce(p,att,wa.key);
    await wa.run(p,att); render(); if (G.over) return;
  }
  if (att===A.leader && T(A.leader,ROCKS)) for (const c of [...A.chars]){ const g=FX_(c).leaderAtk; if (g && onceOk(p,c,'lg')){ markOnce(p,c,'lg'); await g.run(p,c); render(); } }
  if (G.over) return;
  if (D.isAI) await aiDefend(d); else await humanDefend(d);
  if (G.over || !G.battle) return;
  const t=G.battle.target;
  // إذا غادر المهاجم أو الهدف الملعب أثناء الدفاع تنتهي المعركة دون ضرر
  if (!isOnField(att) || !isOnField(t)){ fx(tgt.uid,'انتهت المعركة','#7dd3ff'); }
  else {
  const ap=power(att), tp=power(t);
  if (ap>=tp){
    if (t.def.t==='L'){
      if (D.life.length===0){ anim(t.uid,'hit'); fx(t.uid,'💥 النهاية!','#ff5b5b'); sfx('ko'); await sleep(700);
        gameOver(p, `${esc(A.name)} وجّه الضربة القاضية إلى ${nm(D.leader)}!`); return; }
      const dmg=hasKw(att,'double')?2:1;
      if (dmg===2) fx(att.uid,'⚔⚔ هجوم مزدوج!','#ffb36b');
      for (let i=0; i<dmg && D.life.length>0 && !G.over; i++) await takeLife(d, hasKw(att,'ban'));
    } else if (battleImmune(t, att)){
      fx(t.uid,'صامد! 🛡','#7dd3ff'); sfx('block');
    } else {
      anim(t.uid,'hit'); fx(t.uid,'KO!','#ff5b5b'); await sleep(400);
      if (!await tryReplace(t, true, false)) await koRaw(t);
    }
  } else { fx(t.uid,'صد! 🛡','#7dd3ff'); sfx('block'); }
  // هوكينز (ST02-010): يعود نشطاً بعد قتال شخصية للخصم خلال دوره
  if (att.def.n==='ST02-010' && att.don>=1 && t.def.t==='C' && isOnField(att) && onceOk(p,att,'hw')){ markOnce(p,att,'hw'); att.rested=false; fx(att.uid,'🔄','#7dff9b'); }
  }
  G.players.forEach(pl=>[pl.leader,...pl.chars].forEach(c=>c.battlePower=0));
  G.battle=null; render();
}

/* ---------------- الذكاء الاصطناعي ---------------- */
function aiPickPlay(p){
  const pl=P(p);
  const opts=pl.hand.filter(c=>{
    if (!canPlay(p,c).ok) return false;
    const f=FX_(c);
    if (c.def.t==='S') return !pl.stage;
    if (c.def.t==='E') return f.main.ai ? f.main.ai(p,c) : true;
    return true;
  });
  opts.sort((a,b)=>(b.def.t==='C')-(a.def.t==='C') || handCost(b)-handCost(a));
  return opts[0];
}
async function aiActivates(p){
  const pl=P(p);
  for (const c of [pl.leader, ...pl.chars, ...(pl.stage?[pl.stage]:[])]){
    if (G.over) return;
    if (!isOnField(c) || !actAvail(p,c)) continue;
    const a=FX_(c).act; if (a.ai && !a.ai(p,c)) continue;
    await runAct(p,c); await sleep(500);
  }
}
async function aiTurn(p){
  const A=P(p), O=P(1-p);
  await aiActivates(p);
  for (let g=0; g<15; g++){
    if (G.over) return;
    const c=aiPickPlay(p); if (!c) break;
    await playFromHand(p,c); await sleep(600);
    await aiActivates(p);
  }
  if (G.over) return;
  const attackers=()=>[...A.chars.filter(c=>atkMode(c)), ...(atkMode(A.leader)?[A.leader]:[])];
  if (G.turnCount>1 && A.donActive>0){
    const olp=power(O.leader);
    for (const c of attackers()){ if (c===A.leader || atkMode(c)!=='all') continue; const need=Math.ceil((olp-power(c))/1000); if (need>0 && need<=A.donActive-(atkMode(A.leader)?1:0)) attachDon(p,c,need); }
    if (A.donActive>0){ const t=atkMode(A.leader)?A.leader:attackers().sort((a,b)=>power(b)-power(a))[0]; if (t) attachDon(p,t,A.donActive); }
    render(); await sleep(600);
  }
  // جولتا هجوم: بعد الأولى قد تعيد بعض القدرات تنشيط البطاقات
  for (let pass=0; pass<2; pass++){
  if (pass===1){ await aiActivates(p); if (G.over) return; }
  const list=attackers().sort((a,b)=>power(b)-power(a));
  for (const c of list){
    if (G.over) return;
    if (!atkMode(c)) continue;
    const tg=attackTargets(c); if (!tg.length) continue;
    const ap=power(c);
    const kill=tg.filter(x=>x.def.t==='C'&&power(x)<=ap).sort((a,b)=>costOf(b)-costOf(a));
    const L=tg.includes(O.leader)?O.leader:null;
    let t=null;
    if (kill.length && costOf(kill[0])>=3 && (O.life.length>2 || !L || ap<power(L))) t=kill[0];
    else if (L && ap>=power(L)) t=L;
    else if (kill.length) t=kill[0];
    if (!t) continue;
    await declareAttack(c,t); await sleep(550);
  }
  }
}

/* ---------------- مسار الدور ---------------- */
async function setPhase(ph, ms=350){ G.phase=ph; render(); await sleep(ms); }
async function startTurn(p){
  if (G.over) return;
  G.turnPlayer=p; G.turnCount++;
  const pl=P(p);
  G.players.forEach(x=>x.once={});
  emit('turn', p, G.turnCount); sfx('turn');
  [pl.leader, ...pl.chars].forEach(c=>{ pl.donActive+=c.don; c.don=0; c.sick=false;
    if (!c.mods.some(m=>m.k==='noRefresh'&&m.until>=G.turnCount)) c.rested=false; });
  pl.donActive+=pl.donRested; pl.donRested=0;
  if (pl.stage) pl.stage.rested=false;
  await setPhase('refresh', 500);
  if (G.turnCount!==1){ if (!draw(p,1)) return; }
  await setPhase('draw');
  const n=Math.min(G.turnCount===1?1:2, pl.donDeck); pl.donDeck-=n; pl.donActive+=n; if (n) sfx('don');
  await setPhase('don');
  G.phase='main';
  if (pl.isAI){ G.busy=true; render(); await sleep(900); await aiTurn(p); if (!G.over) await endTurn(p); }
  else { G.busy=false; render(); }
}
async function endTurn(p){
  if (G.over) return;
  G.busy=true; G.selected=null;
  await setPhase('end', 300);
  const pl=P(p);
  for (const c of [...pl.chars]){ const e=FX_(c).endTurn; if (e && isOnField(c)){ await e(p,c); render(); if (G.over) return; } }
  G.players.forEach(x=>[x.leader,...x.chars,...(x.stage?[x.stage]:[])].forEach(c=>c.mods=c.mods.filter(m=>m.until>G.turnCount)));
  startTurn(1-p);
}
function gameOver(winner, reason){
  if (G.over) return;
  G.over=true; G.busy=true; G.targeting=null; render();
  if (NET && NET.role==='host' && NET.open) NET.send({t:'over', w:winner, reason});
  setTimeout(()=>finishMatch(winner===ME, reason), 1200);
}
function finishMatch(win, reason){
  if (G.finished) return; G.finished=true;
  let drp=0, dc=0, promo=null;
  if (ACC){
    if (G.mode==='ai'){ drp = win ? (G.diff==='easy'?10:25) : (G.diff==='easy'?-5:-10); dc = win ? (G.diff==='easy'?40:70) : 20; }
    else { drp = 0; dc = win?60:25; }  // المبارزة الودية لا تؤثر على التصنيف
    const before=rankOf(ACC.rp);
    ACC.rp=Math.max(0, ACC.rp+drp); ACC.coins+=dc; if (win) ACC.wins++; else ACC.losses++;
    const after=rankOf(ACC.rp); if (after.min>before.min) promo=after;
    saveAcc();
  }
  if (win){ confetti(); SFX.play('win'); } else SFX.play('lose');
  const again = G.mode==='ai' ? `<button class="btn" data-act="again">⚔️ مباراة جديدة</button>` : '';
  openModal(`<div class="go ${win?'win':'lose'}"><div class="emoji">${win?'🏆':'☠️'}</div>
    <h2>${win?'النصر!':'الهزيمة...'}</h2><p>${reason}</p>
    ${ACC?`<div class="rewards"><div>💰 +${dc} بيري</div>${G.mode==='online'?`<div>🤝 مبارزة ودية — بدون تصنيف</div>`:`<div style="color:${drp>=0?'#7dff9b':'#ff9a9a'}">🏅 ${drp>=0?'+':''}${drp} نقطة تصنيف</div>`}<div>${rankOf(ACC.rp).icon} ${rankOf(ACC.rp).name}</div></div>`:''}
    ${promo?`<p style="font-size:1.2rem;color:#ffd84a;font-weight:900">🎉 ترقية! أصبحت: ${promo.icon} ${promo.name}</p>`:''}
    <div class="modal-btns">${again}<button class="btn sec" data-act="home">🏠 الصفحة الرئيسية</button></div></div>`,
    { again:()=>{ closeModal(); startAIGame(G.deckRef, G.diff); }, home:()=>{ closeModal(); leaveGame(); } });
}
function leaveGame(){ if (NET){ NET.close(); NET=null; } G=null; ME=0; go('home'); }

/* ---------------- إنشاء المباراة ---------------- */
function mkPlayer(idx, name, deckObj, ctrl, rp=0){
  const ld=DB[deckObj.leader];
  const deck=[]; for (const [n,k] of Object.entries(deckObj.cards)) for (let i=0;i<k;i++) deck.push(mkInst(DB[n],idx));
  shuffle(deck);
  return {idx, name, ctrl, isAI:ctrl==='ai', rp, leader:mkInst(ld,idx), deck, hand:[], life:[], trash:[], chars:[], stage:null,
          donDeck:10, donActive:0, donRested:0, once:{}, noCharPlay:-1};
}
async function mulligan(p){
  const pl=P(p);
  if (pl.isAI){ if (!pl.hand.some(c=>c.def.t==='C'&&c.def.cost<=3)){ pl.deck.push(...pl.hand); pl.hand=[]; shuffle(pl.deck); for (let i=0;i<5;i++) pl.hand.push(pl.deck.pop()); } return; }
  const r=await choice(p, `<h2>🃏 يدك الافتتاحية</h2><p>احتفظ بهذه البطاقات أم أعد السحب مرة واحدة؟</p>
    <div class="choices">${pl.hand.map(c=>cardFace(c,{where:'modal'})).join('')}</div>
    <div class="modal-btns"><button class="btn" data-act="keep">✔ احتفظ</button><button class="btn sec" data-act="redraw">🔄 أعد السحب</button></div>`, ['keep','redraw']);
  if (r.a==='redraw'){
    pl.deck.push(...pl.hand); pl.hand=[]; shuffle(pl.deck); for (let i=0;i<5;i++) pl.hand.push(pl.deck.pop());
    sfx('shuffle'); render();
    await choice(p, `<h2>🃏 يدك الجديدة</h2><div class="choices">${pl.hand.map(c=>cardFace(c,{where:'modal'})).join('')}</div>
      <div class="modal-btns"><button class="btn" data-act="go">⚓ لنبدأ!</button></div>`, ['go']);
  }
}
async function beginMatch(){
  G.players.forEach(pl=>{ for (let i=0;i<5;i++) pl.hand.push(pl.deck.pop()); });
  go('game'); sfx('shuffle');
  await Promise.all([mulligan(0), mulligan(1)]);
  if (!G) return;
  G.players.forEach(pl=>{ for (let i=0;i<pl.leader.def.life;i++) pl.life.push(pl.deck.pop()); });
  const first=Math.random()<.5?0:1;
  render(); showBanner('🪙 القرعة', `${esc(P(first).name)} يبدأ أولاً!`); sfx('coin');
  await sleep(1800);
  startTurn(first);
}
function startAIGame(deck, diff){
  const others=LEADER_IDS.filter(x=>x!==deck.leader);
  const oppN=others[Math.random()*others.length|0];
  ME=0;
  G={players:[mkPlayer(0, ACC.name, deck, 'local', ACC.rp), mkPlayer(1, 'الكمبيوتر 🤖', {leader:oppN, cards:deckCounts(oppN)}, 'ai', diff==='easy'?120:480)],
     turnPlayer:0, turnCount:0, phase:'setup', selected:null, targeting:null, busy:true, over:false, battle:null, mode:'ai', diff, deckRef:deck};
  beginMatch();
}

/* =========================================================
   اللعب الأونلاين (PeerJS: الوسيط العام يعرّف اللاعبين، ثم الاتصال مباشر بين المتصفحين)
   ========================================================= */
function loadPeer(){
  return new Promise((res,rej)=>{ if (window.Peer) return res();
    const s=document.createElement('script'); s.src='https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js';
    s.onload=()=>res(); s.onerror=()=>rej(new Error('تعذّر تحميل مكتبة الاتصال — تحقق من الإنترنت')); document.head.appendChild(s); });
}
class Net{
  constructor(role){ this.role=role; this.peer=null; this.conn=null; this.open=false; this.pending={}; this.rid=0; this.status=''; }
  send(m){ if (this.conn && this.open) this.conn.send(m); }
  request(m){ const id=++this.rid; m.id=id; this.send(m); return new Promise(res=>this.pending[id]=res); }
  close(){ this.open=false; try{ this.conn&&this.conn.close(); }catch(e){} try{ this.peer&&this.peer.destroy(); }catch(e){} }
  attach(conn){
    this.conn=conn;
    conn.on('open', ()=>{ this.open=true; this.send({t:'hello', name:ACC.name, rp:ACC.rp, deck:ONLINE.deck}); ONLINE.status='✅ تم الاتصال! جاري بدء المباراة...'; if (SCREEN==='online') renderOnline(); });
    conn.on('data', m=>this.onData(m));
    conn.on('close', ()=>{ const was=this.open; this.open=false; if (was && G && !G.over){ G.over=true; openModal(`<h2>📡 انقطع الاتصال</h2><p>غادر الخصم المباراة أو انقطع الاتصال.</p><div class="modal-btns"><button class="btn" data-act="h">🏠 الرئيسية</button></div>`,{h:()=>{ closeModal(); leaveGame(); }}); } });
  }
  onData(m){
    if (m.t==='hello'){ ONLINE.opp=m; if (m.deck && m.deck.custom) registerCustom(m.deck.custom); if (this.role==='host') startOnlineGame(); return; }
    if (this.role==='host'){
      if (m.t==='reply'){ const r=this.pending[m.id]; delete this.pending[m.id]; if (r) r({a:m.a, i:m.i}); }
      else if (m.t==='act') performAction(1, m.act, m.uid, m.tgt);
    } else {
      if (m.t==='snap') applySnap(m.s);
      // روابط الصور في النافذة القادمة تخص متصفح المضيف، فنستبدلها بروابط هذا المتصفح
      else if (m.t==='modal') openModal(m.html,Object.fromEntries(m.acts.map(a=>[a, el=>{ closeModal(); this.send({t:'reply', id:m.id, a, i:el.dataset.i}); }])));
      else if (m.t==='ev') applyEv(m.kind, m.args);

async function hostRoom(){

  ONLINE.deck={leader:d.leader, cards:d.cards, custom:(ACC.custom||[]).find(c=>c.id===d.leader)||null};
  ONLINE.code=Array.from({length:6},()=>'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[Math.random()*32|0]).join('');
  ONLINE.status='⏳ جاري إنشاء الغرفة...'; renderOnline();
  try{ await loadPeer(); }catch(e){ ONLINE.status='❌ '+e.message; renderOnline(); return; }
  NET=new Net('host');

  NET.peer.on('open', ()=>{ ONLINE.status='⏳ بانتظار انضمام صديقك... شارك الرمز معه'; renderOnline(); });
  NET.peer.on('connection', conn=>{ if (NET.conn){ conn.close(); return; } NET.attach(conn); });

}
async function joinRoom(code){

  ONLINE.deck={leader:d.leader, cards:d.cards, custom:(ACC.custom||[]).find(c=>c.id===d.leader)||null}; ONLINE.status='⏳ جاري الاتصال...'; renderOnline();

    if (G.selected===c.uid) cls.push('selected');

  if (G && G.players && where==='field'){
    const st=[];
    if (c.mods.some(m=>m.k==='cantAttack')) st.push('⛔');
    if (c.mods.some(m=>m.k==='noRefresh')) st.push('🔒');
    if (c.mods.some(m=>m.k==='kw'&&m.v==='unblockable')) st.push('🚫');
    if (hasKw(c,'blocker')&&!d.kw.includes('blocker')) st.push('🛡');

function fit(){
  const W=window.innerWidth, H=window.innerHeight;
  const small = W<=700;
  const hcw = small ? Math.min(104, Math.max(84, W*.26)) : Math.max(78, Math.min(W*.07, 118));   // بطاقات اليد أكبر
  document.documentElement.style.setProperty('--hcw', hcw+'px');
  const hudH = W<=900 ? 96 : 56;   // شريط الأدوات يلتف في سطرين على الجوال
  // الجوال بالوضع العمودي: ميل أقل ومنظور أبعد لتصبح الحلبة أعرض
  const phone = W<=700 && H>W;
  const g = phone ? {tilt:20, pm:6, sy:-.063, sh:1.41, wr:1.09} : {tilt:38, pm:3.2, sy:-.205, sh:1.255, wr:1.22};
  const mw=Math.max(260, Math.min((W-12)/g.wr, (H-hudH-hcw*1.397*.5)/g.sh, 1200));
  const s=document.documentElement.style;
  // حجم البطاقات على الحلبة: أكبر على الجوال (المساحات بين البطاقات أضيق)
  s.setProperty('--cwr', small ? .16 : .125); s.setProperty('--slotr', small ? 1 : 1.12); s.setProperty('--hpk', small ? .88 : .6);
  s.setProperty('--mw', mw+'px'); s.setProperty('--tilt', g.tilt+'deg'); s.setProperty('--pm', g.pm); s.setProperty('--sy', g.sy); s.setProperty('--sh', g.sh);
}

function rollPack(pk){
  const pool=Object.values(DB).filter(d=>(!pk.set||d.set===pk.set) && (!pk.color||d.colors.includes(pk.color)));
  const W={C:52,UC:28,R:13,SR:5,SEC:1,L:2};
  const roll=(allowed)=>{ const opts=pool.filter(d=>allowed.includes(rarity(d))); const tot=opts.reduce((s,d)=>s+W[rarity(d)],0); let r=Math.random()*tot; for (const d of opts){ r-=W[rarity(d)]; if (r<=0) return d; } return opts[0]; };
  const any=['C','UC','R','SR','SEC','L'];
  return [roll(any),roll(any),roll(any),roll(any),roll(['R','SR','SEC','L'])];
}
