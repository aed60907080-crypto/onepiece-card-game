        <div class="row"><button data-act="cledit" data-id="${c.id}" style="width:auto;padding:0 12px">✏ تعديل</button><button data-act="cldel" data-id="${c.id}" style="width:auto;padding:0 12px">🗑</button></div></div>`:'').join('')||'<p>لم تصمّم أي قائد بعد.</p>'}</div></div>`;
    return;
  }
  clFix();
  const tmp={uid:-1, def:customDef({...CL, id:'CL-preview'}), owner:null, rested:false, don:0, mods:[], sick:false, battlePower:0};
  const pool=Object.values(DB).filter(d=>!d.custom && (CLSET==='all'||d.set===CLSET)).sort((a,b)=>(b.t==='L')-(a.t==='L')||a.id.localeCompare(b.id));
  const base=DB[CL.like];
  $('#app').innerHTML=`<div class="page">${topbar(true)}
    <div class="pagehead"><h1>${CL.isNew?'➕ قائد جديد':'✏ تعديل القائد'}</h1>
      <button class="btn green" data-act="clsave">💾 حفظ القائد</button><button class="btn sec sm" data-act="clback">رجوع</button></div>
    <div class="editor" style="grid-template-columns:260px 1fr">
      <div class="panel" style="text-align:center"><h3>المعاينة</h3><div style="display:flex;justify-content:center;--cw:200px">${cardFace(tmp,{where:'modal'})}</div>
        <p style="font-size:.8rem;color:#c3d3e4;text-align:right;margin-top:12px"><b style="color:var(--gold)">القدرة:</b> ${FX[CL.like].d}</p>
        <p style="font-size:.7rem;opacity:.6;text-align:right">مستعارة من ${base.ar} (${base.id}) • الأنواع: ${base.types.join(' / ')}</p></div>
      <div style="display:flex;flex-direction:column;gap:14px">
        <div class="panel"><div class="field"><label>اسم القائد</label><input id="clname" value="${esc(CL.name)}" maxlength="22" placeholder="مثال: قبطان البحر الأحمر"></div></div>
        <div class="panel"><h3>🎨 اللون (واحد أو اثنان)</h3>
          <div class="chips">${COLORS.map(c=>`<button data-act="clcol" data-c="${c}" class="${CL.colors.includes(c)?'on':''}" style="background:${COLOR[c]}">${COLOR_AR[c]}</button>`).join('')}</div>
          <h3 style="margin-top:14px">❤ الحياة</h3>
          <div class="chips">${[4,5].map(v=>`<button data-act="cllife" data-v="${v}" class="${CL.life===v?'on':''}" style="background:#8a1122" ${v===5&&CL.colors.length>1?'disabled':''}>${v}</button>`).join('')}</div>
          <h3 style="margin-top:14px">⚡ القوة</h3>
          <div class="chips">${[4000,5000,6000].map(v=>`<button data-act="clpow" data-v="${v}" class="${CL.power===v?'on':''}" style="background:#34506e" ${v===6000&&CL.life>4?'disabled':''}>${v}</button>`).join('')}</div>
          <p style="font-size:.72rem;opacity:.7">للتوازن: القائد ذو اللونين حياته 4، وقوة 6000 متاحة فقط مع حياة 4.</p></div>
        <div class="panel"><h3>✨ القدرة (اختر قائداً رسمياً تستعير قدرته)</h3>
          <div class="ablist2">${OFFICIAL_LEADERS().map(n=>`<div class="ab2 ${CL.like===n?'on':''}" data-act="clab" data-n="${n}">${defFace(n)}<div><b>${DB[n].ar}</b> <small style="opacity:.6">${DB[n].id}</small><p>${FX[n].d}</p></div></div>`).join('')}</div></div>
        <div class="panel"><h3>🖼 الصورة (اختر أي بطاقة من المجموعة)</h3>
          <div class="filters">${[['all','الكل'],...Object.keys(SETS).map(s=>[s,s])].map(([k,l])=>`<button class="btn sec sm ${CLSET===k?'on':''}" data-act="clset" data-f="${k}">${l}</button>`).join('')}</div>
          <div class="lm-grid">${pool.map(d=>defFace(d.n,{cls:CL.img===d.n?'on':'',attrs:`data-act="climg" data-n="${d.n}"`,extra:''}).replace('draggable="false"','draggable="false" loading="lazy"')).join('')}</div></div>
      </div></div></div>`;
}
function leaderAction(a, ds){
  const nameEl=$('#clname'); if (CL && nameEl) CL.name=nameEl.value.trim();
  if (a==='clnew'){ CL={id:'CL-'+ACC.name+'-'+Date.now().toString(36), name:'', img:'OP01-003', colors:['red'], life:5, power:5000, like:'OP01-001', isNew:true}; return renderLeaders(); }
  if (a==='cledit'){ CL={...ACC.custom.find(c=>c.id===ds.id)}; return renderLeaders(); }
  if (a==='cldel'){ const c=ACC.custom.find(x=>x.id===ds.id); openModal(`<h2>🗑 حذف ${esc(c.name)}؟</h2><p>المجموعات التي تستخدمه ستحتاج قائداً جديداً.</p><div class="modal-btns"><button class="btn red" data-act="y">حذف</button><button class="btn sec" data-act="n">إلغاء</button></div>`,
      {y:()=>{ ACC.custom=ACC.custom.filter(x=>x.id!==ds.id); delete DB[ds.id]; ACC.decks.forEach(d=>{ if (d.leader===ds.id) d.leader=null; }); if (!validDecks().some(x=>x.id===ACC.active)) ACC.active=(validDecks()[0]||{}).id; saveAcc(); closeModal(); renderLeaders(); }, n:closeModal}); return; }
  if (!CL) return;
  if (a==='clback'){ CL=null; return renderLeaders(); }
  if (a==='clcol'){ const c=ds.c; if (CL.colors.includes(c)){ if (CL.colors.length>1) CL.colors=CL.colors.filter(x=>x!==c); } else CL.colors=CL.colors.length>=2?[CL.colors[1],c]:[...CL.colors,c]; SFX.play('select'); return renderLeaders(); }
  if (a==='cllife'){ CL.life=+ds.v; if (CL.life>4 && CL.power>5000) CL.power=5000; return renderLeaders(); }
  if (a==='clpow'){ CL.power=+ds.v; return renderLeaders(); }
  if (a==='clab'){ CL.like=ds.n; SFX.play('select'); return renderLeaders(); }
  if (a==='climg'){ CL.img=ds.n; SFX.play('select'); const sc=document.querySelector('.lm-grid').scrollTop; renderLeaders(); document.querySelector('.lm-grid').scrollTop=sc; return; }
  if (a==='clset'){ CLSET=ds.f; return renderLeaders(); }
  if (a==='clsave'){
    if (CL.name.length<2){ toast('اكتب اسماً للقائد (حرفان على الأقل)'); SFX.play('error'); return; }
    clFix(); const {isNew, ...cl}=CL;
    ACC.custom=ACC.custom||[];
    const i=ACC.custom.findIndex(x=>x.id===cl.id); if (i>=0) ACC.custom[i]=cl; else ACC.custom.push(cl);
    registerCustom(cl);
    // تنظيف المجموعات التي تستخدمه من البطاقات التي لم تعد تناسب ألوانه
    ACC.decks.forEach(d=>{ if (d.leader===cl.id) for (const k of Object.keys(d.cards)) if (!fits(DB[k],cl.id)) delete d.cards[k]; });
    saveAcc(); SFX.play('coin'); toast(isNew?'✔ تم إنشاء القائد — تجده الآن في منشئ المجموعات':'✔ تم حفظ التعديلات');
    CL=null; return renderLeaders();
  }
}
function showRules(){
  openModal(`<h2>📜 قوانين اللعبة</h2><div class="rules">
    <h3>🎯 الفوز</h3><ul><li>اخفض حياة الخصم إلى صفر، ثم انجح في هجوم أخير على قائده.</li><li>أو عندما يضطر الخصم للسحب ومجموعته فارغة.</li></ul>
    <h3>🔄 مراحل الدور</h3><ul>
      <li><b>Refresh:</b> تنشط كل بطاقاتك وتعود DON!! المرفقة إلى منطقة التكلفة.</li>
      <li><b>Draw:</b> اسحب بطاقة (اللاعب الأول لا يسحب في دوره الأول).</li>
      <li><b>DON!!:</b> أضف 2 DON!! (واحدة فقط للاعب الأول في دوره الأول).</li>
      <li><b>Main:</b> العب البطاقات، فعّل القدرات، أرفق DON!! (+1000 لكل واحدة)، وهاجم.</li>
      <li><b>End:</b> تُفعَّل قدرات "نهاية دورك" وتنتهي التأثيرات المؤقتة.</li></ul>
    <h3>⚔️ الهجوم والدفاع</h3><ul>
      <li>الأهداف: قائد الخصم أو شخصياته المستريحة فقط.</li>
      <li>الشخصية لا تهاجم في دور لعبها إلا بـ<b>الاندفاع</b>.</li>
      <li>المدافع: يفعّل قدرات "عند هجوم الخصم" ← يصد بشخصية <b>حارسة</b> ← يستخدم بطاقات <b>المضاد</b>.</li>
      <li>إذا كانت قوة المهاجم ≥ قوة المدافع: الشخصية تُقصى، والقائد يخسر بطاقة حياة إلى اليد (مع إمكانية تفعيل <b>التريغر</b>).</li></ul>
  </div><div class="modal-btns"><button class="btn" data-act="ok">فهمت! ⚓</button></div>`, {ok:closeModal});
}

/* =========================================================
   التفاعل
   ========================================================= */
function toggleSetting(k){
  SETTINGS[k]=!SETTINGS[k]; saveSettings();
  if (k==='music'){ if (SETTINGS.music) SFX.musicStart(); else SFX.musicStop(); }
  if (SCREEN==='game') render(); else go(SCREEN);
}
$('#app').addEventListener('click', async e=>{
  const a0=e.target.closest('button,[data-act]'); if (a0 && a0.tagName==='BUTTON') SFX.play('click');
  const actEl=e.target.closest('[data-act]');
  if (actEl){
    const a=actEl.dataset.act, ds=actEl.dataset;
    // عام
    if (a==='sfx') return toggleSetting('sfx');
    if (a==='music') return toggleSetting('music');
    if (a==='rules') return showRules();
    if (a==='install') return installApp();
    if (a==='nav'){ if (NET && !G){ NET.close(); NET=null; ONLINE.status=''; } return go(ds.to); }
    // تسجيل الدخول
    if (a==='atab'){ AUTH.tab=ds.t; AUTH.err=''; return renderAuth(); }
    if (a==='asel'){ AUTH.sel=ds.n; renderAuth(); $('#lp').focus(); return; }
    if (a==='starter'){ AUTH.starter=ds.n; SFX.play('select'); return renderAuth(); }
    if (a==='login'){ const err=await login($('#lu').value.trim(), $('#lp').value); if (err){ AUTH.err=err; SFX.play('error'); return renderAuth(); } AUTH.err=''; SFX.play('coin'); return go('home'); }
    if (a==='register'){ const err=await register($('#ru').value, $('#rp').value, AUTH.starter); if (err){ AUTH.err=err; SFX.play('error'); return renderAuth(); } AUTH.err=''; SFX.play('win'); return go('home'); }
    if (a==='logout') return logout();
    // اختيار المجموعة والصعوبة
    if (a==='seldeck'){ SEL_DECK=ds.id; SFX.play('select'); return go(SCREEN); }
    if (a==='diff'){ DIFF=ds.d; return renderAI(); }
    if (a==='startai'){ const d=selectedDeck(); if (d) startAIGame(d, DIFF); return; }
    // أونلاين
    if (a==='host') return hostRoom();
    if (a==='join') return joinRoom($('#jcode').value);
    if (a==='copy'){ try{ await navigator.clipboard.writeText(ONLINE.code); toast('تم نسخ الرمز'); }catch(err){ toast(ONLINE.code); } return; }
    if (a==='cancelnet'){ if (NET){ NET.close(); NET=null; } ONLINE.status=''; return renderOnline(); }
    // المجموعات
    if (a==='newdeck'){ const l=LEADER_IDS.find(n=>ACC.col[n]>0); DE={id:'d'+Date.now(), name:'مجموعة جديدة', leader:l, cards:{}, isNew:true}; return renderDecks(); }
    if (a==='editdeck'){ const d=ACC.decks.find(x=>x.id===ds.id); DE=JSON.parse(JSON.stringify(d)); return renderDecks(); }
    if (a==='activedeck'){ ACC.active=ds.id; saveAcc(); return renderDecks(); }
    if (DE){
      const nameEl=$('#dname'); if (nameEl) DE.name=nameEl.value.trim()||'مجموعة';
      if (a==='setleader'){ DE.leader=ds.n; for (const k of Object.keys(DE.cards)) if (!fits(DB[k],ds.n)) delete DE.cards[k]; SFX.play('select'); return renderDecks(); }
      if (a==='dfilter'){ DFILTER=ds.f; return renderDecks(); }
      if (a==='sfilter'){ SFILTER=ds.f; return renderDecks(); }
      if (a==='addc'){ const n=ds.n, v=DE.cards[n]||0; if (deckSize(DE)>=50||v>=maxCopies(n)){ SFX.play('error'); return; } DE.cards[n]=v+1; SFX.play('select'); return renderDecks(); }
      if (a==='remc'){ const n=ds.n; if (DE.cards[n]){ DE.cards[n]--; if (!DE.cards[n]) delete DE.cards[n]; SFX.play('flip'); } return renderDecks(); }
      if (a==='zoomdef') return openModal(`<div class="zoom">${defFace(ds.n)}</div><p>${FX[ds.n]?.d||''}</p><div class="modal-btns"><button class="btn" data-act="ok">إغلاق</button></div>`,{ok:closeModal});
      if (a==='cleardeck'){ DE.cards={}; return renderDecks(); }
      if (a==='autofill'){
        const pool=Object.values(DB).filter(d=>d.t!=='L'&&fits(d,DE.leader)&&ACC.col[d.n]>0).sort((x,y)=>(y.set===DB[DE.leader].set)-(x.set===DB[DE.leader].set)||x.cost-y.cost);
        for (let pass=0; pass<4 && deckSize(DE)<50; pass++) for (const d of pool){ if (deckSize(DE)>=50) break; const v=DE.cards[d.n]||0; if (v<maxCopies(d.n)&&v<=pass) DE.cards[d.n]=v+1; }
        SFX.play('shuffle'); if (deckSize(DE)<50) toast(`تملك ${deckSize(DE)} بطاقة فقط من هذا اللون — اشترِ المزيد من المتجر`);
        return renderDecks();
      }
      if (a==='savedeck'){ const i=ACC.decks.findIndex(x=>x.id===DE.id); const d={id:DE.id,name:DE.name,leader:DE.leader,cards:DE.cards}; if (i>=0) ACC.decks[i]=d; else ACC.decks.push(d);
        if (!deckIssues(d).length && !validDecks().some(x=>x.id===ACC.active)) ACC.active=d.id; saveAcc(); SFX.play('coin'); toast(deckIssues(d).length?'حُفظت (غير مكتملة بعد)':'✔ حُفظت المجموعة'); DE=null; return renderDecks(); }
      if (a==='deldeck'){ ACC.decks=ACC.decks.filter(x=>x.id!==DE.id); if (ACC.active===DE.id) ACC.active=(ACC.decks[0]||{}).id; saveAcc(); DE=null; return renderDecks(); }
      if (a==='closedeck'){ DE=null; return renderDecks(); }
    }
    // صانع القادة
    if (a.startsWith('cl') && !['cleardeck','closedeck'].includes(a)) return leaderAction(a, ds);
    // المتجر
    if (a==='buy') return buyPack(ds.p);
    // اللعبة
    if (!G || SCREEN!=='game') return;
    if (a==='leave'){ openModal(`<h2>🏳 استسلام؟</h2><p>ستُحتسب المباراة خسارة.</p><div class="modal-btns"><button class="btn red" data-act="y">استسلام</button><button class="btn sec" data-act="n">متابعة اللعب</button></div>`,
        {y:()=>{ closeModal(); if (G.over) return leaveGame(); doAct('surrender'); }, n:closeModal}); return; }
    if (a==='cancelTarget'){ resolveTarget(null); return; }
    if (a==='deselect'){ G.selected=null; render(); return; }
    if (a==='zoom'){ const s=findCard(+ds.z); if (s) openModal(`<div class="zoom">${cardFace(s.c,{where:'modal'})}</div><p>${FX_(s.c).d||''}</p><div class="modal-btns"><button class="btn" data-act="ok">إغلاق</button></div>`,{ok:closeModal}); return; }
    if (!isMyMain()) return;
    if (a==='end'){ G.selected=null; doAct('end'); return; }
    const s=G.selected && findCard(G.selected); if (!s) return;
    if (a==='attack'){
      const att=s.c, tg=attackTargets(att); if (!tg.length) return;
      G.selected=null;
      const t=await pickTarget('اختر هدف الهجوم على الحلبة', tg, true);
      if (t && !G.over) doAct('attack', att.uid, t.uid); else render();
      return;
    }
    if (['play','don','donall','activate'].includes(a)) doAct(a, s.c.uid);
    return;
  }
  const cardEl=e.target.closest('[data-uid]');
  if (!cardEl || !G || SCREEN!=='game') return;
  const uid=+cardEl.dataset.uid; if (uid<0) return;
  if (G.targeting){ if (G.targeting.uids.has(uid)) resolveTarget(uid); return; }
  if (!findCard(uid)) return;
  G.selected = G.selected===uid ? null : uid; SFX.play('select');
  render();
});
document.addEventListener('keydown', e=>{
  if (e.key==='Escape' && G && SCREEN==='game'){ if (G.targeting && G.targeting.allowCancel) resolveTarget(null); else if (G.selected){ G.selected=null; render(); } }
  if (e.key==='Enter' && SCREEN==='auth'){ const b=$(AUTH.tab==='login'?'[data-act=login]':'[data-act=register]'); if (b) b.click(); }
});

// البداية
(()=>{ let cur=null; try{ cur=localStorage.getItem('op17_current'); }catch(e){}
  const a=cur && loadAccs()[cur]; if (a){ ACC=a; loadCustoms(); go('home'); } else go('auth'); })();
</script>
